<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Dashboard Enterplak - Controle de Embarques</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="shopfloor-tabs.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* Enterplak Brand Palette - Borgonha */
            --brand: #7B1A2C;
            --brand-dark: #5A1220;
            --brand-light: #9B2840;
            --brand-lighter: #9B2840;
            --brand-bg: rgba(123, 26, 44, 0.08);
            --brand-bg-hover: rgba(123, 26, 44, 0.04);

            /* UI - Light Mode (default) */
            --bg: #F3F0F1;
            --bg-warm: #EBE7E9;
            --card: rgba(255, 255, 255, 0.45);
            --card-border: rgba(255, 255, 255, 0.35);
            --text: #2D1F25;
            --text-muted: #7A6A72;
            --shadow: rgba(0,0,0,0.06);
            --chart-text: #7A6A72;
            --chart-grid: rgba(123, 26, 44, 0.08);
            --calendar-invert: none;
            --glass-blur: blur(16px);
            --glass-border: rgba(255,255,255,0.4);

            /* Status */
            --green: #16a34a;
            --green-bg: rgba(22, 163, 74, 0.10);
            --yellow: #ca8a04;
            --yellow-bg: rgba(202, 138, 4, 0.10);
            --red: #dc2626;
            --red-bg: rgba(220, 38, 38, 0.10);
            --orange: #ea580c;
            --orange-bg: rgba(234, 88, 12, 0.10);
            --blue: #2563eb;
            --blue-bg: rgba(37, 99, 235, 0.10);
        }

        /* Dark Mode */
        [data-theme="dark"] {
            --bg: #0C0A0E;
            --bg-warm: #110E12;
            --card: rgba(30, 20, 25, 0.55);
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #F0EAED;
            --text-muted: #A89BA2;
            --shadow: rgba(0,0,0,0.3);
            --chart-text: #A89BA2;
            --chart-grid: rgba(46, 37, 42, 0.5);
            --calendar-invert: invert(0.7);
            --glass-blur: blur(20px);
            --glass-border: rgba(255,255,255,0.08);

            --green: #22c55e;
            --green-bg: rgba(34, 197, 94, 0.12);
            --yellow: #eab308;
            --yellow-bg: rgba(234, 179, 8, 0.12);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.12);
            --orange: #f97316;
            --orange-bg: rgba(249, 115, 22, 0.12);
            --blue: #3b82f6;
            --blue-bg: rgba(59, 130, 246, 0.12);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        /* Background degradê com efeitos vermelhos */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background:
                radial-gradient(ellipse at 15% 20%, rgba(123, 26, 44, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 80%, rgba(180, 30, 50, 0.20) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(90, 18, 32, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 10%, rgba(220, 38, 38, 0.12) 0%, transparent 40%),
                radial-gradient(ellipse at 20% 90%, rgba(153, 27, 40, 0.15) 0%, transparent 45%);
        }
        [data-theme="dark"] body::before,
        [data-theme="dark"]::before {
            background:
                radial-gradient(ellipse at 15% 20%, rgba(123, 26, 44, 0.35) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 80%, rgba(180, 30, 50, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(90, 18, 32, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 10%, rgba(220, 38, 38, 0.18) 0%, transparent 40%),
                radial-gradient(ellipse at 20% 90%, rgba(153, 27, 40, 0.20) 0%, transparent 45%);
        }

        /* Header */
        .header-top {
            background: linear-gradient(135deg, #1A0A10 0%, #2D111B 40%, #3D1525 70%, #2D111B 100%);
            padding: 0 32px;
            height: 64px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-filters {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 2px solid var(--brand);
            padding: 10px 32px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header-filters label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            font-weight: 600;
            margin-right: -4px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .logo-img {
            height: 36px;
            width: auto;
        }
        /* Logo dentro do header escuro: sempre branco */
        .header-top .logo-img {
            filter: brightness(0) invert(1);
        }
        /* No restante do dash, logo só fica branco no dark mode */
        [data-theme="dark"] .logo-img {
            filter: brightness(0) invert(1);
        }
        .header-divider {
            width: 1px;
            height: 28px;
            background: var(--brand);
            opacity: 0.4;
        }
        .header-title {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.7);
            letter-spacing: 0.5px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .last-update {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
        }
        .filter-separator {
            width: 1px;
            height: 24px;
            background: var(--card-border);
            margin: 0 2px;
        }
        .btn-refresh, .btn-fullscreen {
            padding: 8px 18px;
            border: 1px solid rgba(255,255,255,0.25);
            background: transparent;
            color: rgba(255,255,255,0.85);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-refresh:hover, .btn-fullscreen:hover {
            background: var(--brand);
            color: #fff;
        }
        .btn-fullscreen svg { width: 16px; height: 16px; fill: currentColor; }

        /* Auto-refresh countdown bar */
        .refresh-bar-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(123, 26, 44, 0.15);
            z-index: 999;
        }
        .refresh-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--brand), var(--brand-lighter));
            width: 100%;
            transition: width 1s linear;
        }
        .refresh-info {
            position: fixed;
            bottom: 42px;
            left: 16px;
            font-size: 11px;
            color: var(--text-muted);
            z-index: 999;
            opacity: 0.6;
        }
        body.fs-mode .refresh-info { bottom: 8px; }

        /* Theme toggle */
        .btn-theme {
            padding: 6px 10px;
            border: 1px solid rgba(255,255,255,0.25);
            background: transparent;
            color: rgba(255,255,255,0.85);
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
        }
        .btn-theme:hover { background: rgba(255,255,255,0.1); }

        /* === Tela de Login === */
        .login-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(123, 26, 44, 0.35), transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(180, 30, 50, 0.30), transparent 50%),
                linear-gradient(135deg, #1A0A10 0%, #2D111B 40%, #3D1525 70%, #1A0A10 100%);
        }
        .login-card {
            background: rgba(30, 20, 25, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 20px;
            padding: 44px 40px 36px;
            width: 420px;
            max-width: 92vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.10);
            color: #f0eaed;
        }
        .login-logo {
            display: block;
            margin: 0 auto 28px;
            height: 48px;
            width: auto;
            filter: brightness(0) invert(1);
        }
        .login-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .login-sub {
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.55);
            margin-bottom: 28px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .login-field {
            display: block;
            margin-bottom: 14px;
        }
        .login-field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.65);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }
        .login-field input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s, background 0.15s;
        }
        .login-field input:focus {
            border-color: #B8344A;
            background: rgba(0,0,0,0.35);
        }
        .login-field input::placeholder { color: rgba(255,255,255,0.3); }
        .login-error {
            display: none;
            background: rgba(220,38,38,0.15);
            border: 1px solid rgba(220,38,38,0.4);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 14px;
            text-align: center;
        }
        .login-error.show { display: block; }
        .login-btn {
            width: 100%;
            padding: 13px 18px;
            background: linear-gradient(135deg, #7B1A2C 0%, #9B2840 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 16px rgba(123,26,44,0.45);
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(123,26,44,0.55);
        }
        .login-btn:active { transform: translateY(0); }
        .login-footer {
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            margin-top: 22px;
            letter-spacing: 0.3px;
        }
        /* Esconde o dashboard quando login está visível */
        body.login-locked > *:not(.login-screen) { display: none !important; }
        body.login-locked { overflow: hidden; }

        /* Botão de logout no header */
        .btn-logout {
            padding: 6px 10px;
            border: 1px solid rgba(255,255,255,0.25);
            background: transparent;
            color: rgba(255,255,255,0.85);
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
        }
        .btn-logout:hover { background: rgba(220,38,38,0.25); border-color: rgba(220,38,38,0.5); }

        /* TV mode: hide cursor after inactivity */
        body.hide-cursor, body.hide-cursor * { cursor: none !important; }

        /* Fullscreen: auto-hide top and bottom bars */
        body.fs-mode .header-top {
            position: fixed; top: 0; left: 0; right: 0; z-index: 3000;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }
        body.fs-mode .header-filters {
            position: fixed; top: 64px; left: 0; right: 0; z-index: 2999;
            transform: translateY(calc(-100% - 64px));
            transition: transform 0.3s ease;
        }
        body.fs-mode .page-bar {
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        /* Hover zones */
        .fs-hover-top, .fs-hover-bottom { display: none; }
        body.fs-mode .fs-hover-top {
            display: block; position: fixed; top: 0; left: 0; right: 0; height: 16px; z-index: 4000;
        }
        body.fs-mode .fs-hover-bottom {
            display: block; position: fixed; bottom: 0; left: 0; right: 0; height: 16px; z-index: 4000;
        }
        body.fs-mode.show-top .header-top {
            transform: translateY(0);
        }
        body.fs-mode.show-top .header-filters {
            transform: translateY(0);
        }
        body.fs-mode.show-bottom .page-bar {
            transform: translateY(0);
        }
        /* Fullscreen: pages fill entire screen, no gaps */
        body.fs-mode { padding-bottom: 0; }
        /* Em fs-mode usamos dimensões fixas do design (1920×1080) ao invés de
           100vw/100vh, porque vw/vh não escalam com o zoom CSS aplicado ao
           <html>. Isso garante que a imagem preencha a tela física inteira
           da smart TV mesmo quando o viewport reportado é menor. */
        body.fs-mode .custom-page-canvas {
            position: fixed; top: 0; left: 0;
            width: 1920px; height: 1080px;
            max-width: none; margin: 0;
            z-index: 1;
        }
        body.fs-mode .custom-page-canvas img {
            width: 100%; height: 100%; object-fit: cover;
        }
        body.fs-mode .empty-canvas {
            position: fixed; top: 0; left: 0;
            width: 1920px; height: 1080px;
            max-width: none; margin: 0;
            z-index: 1;
        }
        @media (max-width: 767px) {
            body.fs-mode .custom-page-canvas,
            body.fs-mode .empty-canvas {
                width: 100vw; height: 100vh;
            }
            body.fs-mode .custom-page-canvas img {
                width: 100vw; height: 100vh;
            }
        }
        body.fs-mode .refresh-bar-container { bottom: 0; z-index: 2000; }
        body.fs-mode .refresh-info { bottom: 8px; z-index: 2000; }

        /* Layout - full width for 1920px */
        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 20px 32px;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        .kpi-card {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 28px 32px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 24px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .kpi-card:hover {
            border-color: rgba(123, 26, 44, 0.4);
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
        }
        .kpi-card.total::before { background: linear-gradient(90deg, var(--brand), var(--brand-lighter)); }
        .kpi-card.ok::before { background: var(--green); }
        .kpi-card.pendente::before { background: var(--yellow); }
        .kpi-card.problema::before { background: #ff0000; height: 4px; }
        .kpi-card.nenhuma::before { background: var(--orange); }

        /* PROBLEMA NO PRAZO - Alert card */
        .kpi-card.problema {
            border: 2px solid #ff0000;
            background: linear-gradient(135deg, #cc0000 0%, #990000 50%, #bb0000 100%);
            box-shadow:
                0 0 20px rgba(255, 0, 0, 0.35),
                0 0 50px rgba(255, 0, 0, 0.15),
                inset 0 0 30px rgba(0, 0, 0, 0.15);
        }
        .kpi-card.problema .kpi-value {
            color: #fff !important;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.5), 0 2px 4px rgba(0,0,0,0.3);
        }
        .kpi-card.problema .kpi-label {
            color: rgba(255,255,255,0.9) !important;
            font-weight: 700;
        }
        .kpi-card.problema .kpi-percent {
            color: rgba(255,255,255,0.7) !important;
        }
        .kpi-card.problema::before {
            background: #ff3333 !important;
            height: 4px;
        }

        /* Glow pulse + shake contínuo */
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255,0,0,0.35), 0 0 50px rgba(255,0,0,0.15); }
            50% { box-shadow: 0 0 35px rgba(255,0,0,0.55), 0 0 70px rgba(255,0,0,0.25), 0 0 100px rgba(255,0,0,0.10); }
        }
        @keyframes shakeLoop {
            0%, 78%, 100% { transform: translateX(0) rotate(0); }
            80% { transform: translateX(-3px) rotate(-0.5deg); }
            82% { transform: translateX(3px) rotate(0.5deg); }
            84% { transform: translateX(-3px) rotate(-0.5deg); }
            86% { transform: translateX(3px) rotate(0.5deg); }
            88% { transform: translateX(-2px) rotate(-0.3deg); }
            90% { transform: translateX(2px) rotate(0.3deg); }
            92% { transform: translateX(0) rotate(0); }
        }
        .kpi-card.problema.alert-animate {
            animation: glowPulse 2s ease-in-out infinite, shakeLoop 3s ease-in-out infinite;
        }

        .kpi-label {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .kpi-value {
            font-size: 52px;
            font-weight: 700;
            line-height: 1;
        }
        .kpi-card.total .kpi-value { color: var(--brand-lighter); }
        .kpi-card.ok .kpi-value { color: var(--green); }
        .kpi-card.pendente .kpi-value { color: var(--yellow); }
        .kpi-card.problema .kpi-value { color: var(--red); }
        .kpi-card.nenhuma .kpi-value { color: var(--orange); }
        .kpi-percent {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        .chart-card {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 24px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .chart-card h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .chart-card h3::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 14px;
            background: var(--brand);
            border-radius: 2px;
            margin-right: 10px;
            vertical-align: middle;
        }
        .chart-container {
            position: relative;
            height: 280px;
        }

        /* Header filters */
        .hf-select, .hf-date {
            padding: 7px 12px;
            background: var(--bg);
            border: 1px solid var(--card-border);
            color: var(--text);
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
            min-width: 140px;
            transition: border-color 0.2s;
        }
        .hf-select:focus, .hf-date:focus { border-color: var(--brand); }
        .hf-select option { background: var(--bg); color: var(--text); }
        .hf-date { min-width: 130px; }
        .hf-date::-webkit-calendar-picker-indicator { filter: var(--calendar-invert); cursor: pointer; }
        .btn-clear-filters {
            padding: 7px 14px;
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-clear-filters:hover { border-color: var(--brand); color: var(--brand-lighter); }
        .active-filter-count {
            background: var(--brand);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
            margin-left: 6px;
        }

        /* Table */
        .table-card {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 24px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .table-card h3 {
            font-size: 13px;
            font-weight: 600;
            padding: 16px 20px;
            border-bottom: 1px solid var(--card-border);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table-card h3::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 14px;
            background: var(--brand);
            border-radius: 2px;
            margin-right: 10px;
            vertical-align: middle;
        }
        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        thead th {
            text-align: left;
            padding: 12px 16px;
            background: rgba(123, 26, 44, 0.08);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            border-bottom: 1px solid var(--card-border);
            cursor: pointer;
            user-select: none;
        }
        thead th:hover { color: var(--brand-lighter); }
        thead th .sort-icon { margin-left: 4px; opacity: 0.4; }
        thead th.sorted .sort-icon { opacity: 1; color: var(--brand-lighter); }
        tbody td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--card-border);
            white-space: nowrap;
        }
        tbody tr:hover { background: var(--brand-bg-hover); }
        tbody tr:last-child td { border-bottom: none; }

        /* Status Badges */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .badge-ok { background: var(--green-bg); color: var(--green); }
        .badge-pendente { background: var(--yellow-bg); color: var(--yellow); }
        .badge-problema { background: var(--red-bg); color: var(--red); }
        .badge-nenhuma { background: var(--orange-bg); color: var(--orange); }
        .badge-default { background: var(--blue-bg); color: var(--blue); }

        /* Loading */
        .loading-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            flex-direction: column;
            gap: 16px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--card-border);
            border-top-color: var(--brand);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .table-footer {
            padding: 12px 20px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
        }

        /* === BOTTOM PAGE BAR (Looker Studio style) === */
        .page-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 36px;
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: stretch;
            z-index: 1000;
            box-shadow: 0 -2px 8px var(--shadow);
        }
        .page-bar-tabs {
            display: flex;
            align-items: stretch;
            overflow-x: auto;
            flex: 1;
        }
        .page-bar-tabs::-webkit-scrollbar { height: 0; }
        .ptab {
            padding: 0 18px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border: none;
            background: none;
            border-top: 2px solid transparent;
            transition: all 0.15s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }
        .ptab:hover { color: var(--text); background: var(--brand-bg-hover); }
        .ptab.active {
            color: var(--brand);
            border-top-color: var(--brand);
            background: var(--brand-bg);
        }
        .ptab-close {
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.15s;
            color: var(--text-muted);
            margin-left: 2px;
        }
        .ptab:hover .ptab-close { opacity: 0.6; }
        .ptab-close:hover { opacity: 1; color: var(--red); }
        .ptab-add {
            padding: 0 12px;
            font-size: 18px;
            font-weight: 400;
            color: var(--text-muted);
            cursor: pointer;
            border: none;
            background: none;
            display: flex;
            align-items: center;
            border-left: 1px solid var(--card-border);
        }
        .ptab-add:hover { color: var(--brand); background: var(--brand-bg-hover); }
        .page-bar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 14px;
            border-left: 1px solid var(--card-border);
            font-size: 11px;
            color: var(--text-muted);
        }
        .rot-toggle {
            width: 30px;
            height: 16px;
            background: var(--card-border);
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            transition: background 0.2s;
        }
        .rot-toggle.on { background: var(--brand); }
        .rot-toggle::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 12px; height: 12px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .rot-toggle.on::after { transform: translateX(14px); }
        .rot-input {
            width: 48px;
            padding: 4px 6px;
            font-size: 12px;
            text-align: center;
            background: var(--bg);
            border: 1px solid var(--card-border);
            color: var(--text);
            border-radius: 4px;
            outline: none;
        }

        /* Page content areas */
        .page-content { display: none; }
        .page-content.active { display: block; }
        /* Abas de OP do ShopFloor (iframe do Fluxo) */
        /* Altura em px de design (não vh): o auto-scale aplica `zoom` no <html> e vh não escala com ele */
        #page-shopfloor-op .sf-op-wrap { position: relative; width: 100%; height: 980px; }
        .sf-op-frame { width: 100%; height: 100%; border: 0; border-radius: 16px; background: var(--card); }
        .sf-op-status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 15px; pointer-events: none; }
        .sf-op-status.hidden { display: none; }
        .sf-op-erro { padding: 48px 16px; text-align: center; color: var(--text); }
        .sf-op-erro p { margin-bottom: 16px; font-size: 16px; }
        body.fs-mode #page-shopfloor-op .sf-op-wrap { position: fixed; top: 0; left: 0; width: 1920px; height: 1080px; z-index: 1; }
        /* Em mobile (sem zoom aplicado), volta a usar viewport para caber na tela */
        @media (max-width: 767px) {
            #page-shopfloor-op .sf-op-wrap { height: calc(100vh - 150px); }
            body.fs-mode #page-shopfloor-op .sf-op-wrap { width: 100vw; height: 100vh; }
        }

        /* === CUSTOM PAGE - Fullscreen image ===
           Dimensões fixas no design 1920×1080 (menos 100px da barra de abas).
           Como o auto-scale aplica `zoom` no <html>, dimensões em px escalam
           corretamente em qualquer dispositivo (smart TV 720p, monitor 1080p, etc).
           Não usar vw/vh aqui — unidades de viewport NÃO respeitam zoom CSS,
           o que fazia a imagem aparecer pequena nas TVs.
        */
        .custom-page-canvas {
            position: relative;
            width: 1920px;
            height: 980px;
            max-width: 100%;
            overflow: hidden;
            background: #000;
            margin: 0 auto;
        }
        .custom-page-canvas img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* Em mobile (sem zoom aplicado), volta a usar viewport para caber na tela */
        @media (max-width: 767px) {
            .custom-page-canvas {
                width: 100%;
                height: calc(100vh - 100px);
            }
        }
        /* Delete overlay */
        .img-delete-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 8px 16px;
            background: rgba(220,38,38,0.85);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .custom-page-canvas:hover .img-delete-btn { opacity: 1; }
        /* Change image overlay */
        .img-change-btn {
            position: absolute;
            top: 16px;
            right: 140px;
            padding: 8px 16px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .custom-page-canvas:hover .img-change-btn { opacity: 1; }

        /* Empty page state — mesma lógica de dimensões fixas do canvas de imagem */
        .empty-canvas {
            width: 1920px;
            height: 980px;
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            cursor: pointer;
            transition: background 0.2s;
            background: var(--bg);
        }
        .empty-canvas:hover, .empty-canvas.dragover {
            background: var(--brand-bg);
        }
        @media (max-width: 767px) {
            .empty-canvas {
                width: 100%;
                height: calc(100vh - 100px);
            }
        }
        .empty-canvas-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: var(--text-muted);
        }
        .empty-canvas-text {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .empty-canvas-hint {
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* Source type indicator on image pages */
        .img-source-badge {
            position: absolute;
            bottom: 16px;
            left: 16px;
            padding: 4px 12px;
            background: rgba(0,0,0,0.5);
            color: rgba(255,255,255,0.7);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .custom-page-canvas:hover .img-source-badge { opacity: 1; }

        /* Choice modal */
        .choice-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }
        .choice-modal {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 32px;
            width: 420px;
            max-width: 90vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .choice-modal h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text);
        }
        .choice-btn {
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 10px;
            border: 1px solid var(--card-border);
            background: var(--bg);
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            color: var(--text);
        }
        .choice-btn:hover { border-color: var(--brand); background: var(--brand-bg); }
        .choice-btn-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .choice-btn-desc {
            font-size: 11px;
            color: var(--text-muted);
        }
        .choice-cancel {
            width: 100%;
            padding: 10px;
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            margin-top: 6px;
        }
        .choice-cancel:hover { color: var(--text); }

        /* URL input modal */
        .url-input-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .url-input-group input {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--card-border);
            color: var(--text);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }
        .url-input-group input:focus { border-color: var(--brand); }
        .url-input-group input::placeholder { color: var(--text-muted); }
        .url-input-group button {
            padding: 10px 20px;
            background: var(--brand);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .url-input-group button:hover { background: var(--brand-light); }

        /* === LOGÍSTICA — Lista de Embarques === */
        .log-list-container {
            padding: 24px 32px;
        }
        .log-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }
        .log-card {
            display: flex;
            align-items: center;
            gap: 28px;
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 22px 22px 22px 22px;
            box-shadow: 0 4px 24px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.12);
        }
        .log-card-img {
            width: 150px;
            height: 150px;
            border-radius: 22px;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 2px 10px var(--shadow);
        }
        .log-card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
            min-width: 0;
        }
        .log-card-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .log-card-name {
            font-size: 32px;
            font-weight: 700;
            color: var(--text);
            margin-right: 8px;
            letter-spacing: -0.5px;
        }
        .log-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            background: rgba(128,128,128,0.10);
            color: var(--text);
        }
        .log-status-pill::before {
            content: '';
            width: 10px; height: 10px;
            border-radius: 50%;
            background: currentColor;
        }
        .log-status-pill.red { color: #dc2626; background: rgba(220,38,38,0.10); }
        .log-status-pill.yellow { color: #ca8a04; background: rgba(234,179,8,0.12); }
        .log-status-pill.green { color: #16a34a; background: rgba(22,163,74,0.10); }

        .log-info-pill {
            display: inline-flex;
            align-items: center;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: rgba(128,128,128,0.08);
            color: var(--text-muted);
        }
        /* Ícone de ajuda discreto + tooltip */
        .info-help {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid currentColor;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            margin-left: 6px;
            cursor: help;
            opacity: 0.45;
            position: relative;
            transition: opacity 0.15s;
            font-family: inherit;
            line-height: 1;
            user-select: none;
            vertical-align: middle;
        }
        .info-help:hover { opacity: 1; }
        /* Variante para ícone dentro do countdown (fundo colorido escuro) */
        .log-countdown .info-help {
            color: rgba(255,255,255,0.85);
            opacity: 0.55;
        }
        .log-countdown .info-help:hover { opacity: 1; }
        .info-help-tip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,25,0.96);
            color: #f4f4f5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.55;
            width: 320px;
            text-align: left;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            text-transform: none;
            letter-spacing: normal;
            font-weight: 400;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .info-help-tip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: rgba(20,20,25,0.96);
        }
        .info-help:hover .info-help-tip { opacity: 1; }
        .info-help-tip strong { color: #fbbf24; font-weight: 700; }
        .info-help-tip ul { margin: 6px 0 0 14px; padding: 0; }
        .info-help-tip li { margin: 3px 0; }

        /* Pill em estado crítico — booking após prazo */
        @keyframes prazoBlink {
            0%, 100% { background: rgba(220, 38, 38, 0.85); box-shadow: 0 0 12px rgba(220,38,38,0.6); }
            50%      { background: rgba(220, 38, 38, 1);    box-shadow: 0 0 28px rgba(220,38,38,0.9), 0 0 50px rgba(220,38,38,0.4); }
        }
        @keyframes prazoShake {
            0%, 90%, 100% { transform: translateX(0) rotate(0); }
            91% { transform: translateX(-2px) rotate(-1deg); }
            93% { transform: translateX(2px) rotate(1deg); }
            95% { transform: translateX(-2px) rotate(-1deg); }
            97% { transform: translateX(2px) rotate(1deg); }
            99% { transform: translateX(0); }
        }
        .log-info-pill.critical {
            color: #fff !important;
            font-weight: 700;
            animation: prazoBlink 1.2s ease-in-out infinite, prazoShake 2s ease-in-out infinite;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .log-info-pill.critical strong {
            color: #fff !important;
        }

        .log-info-pill strong {
            color: var(--text);
            margin-left: 6px;
            font-weight: 700;
        }

        /* Stats row */
        .log-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .log-stat {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            padding: 10px 24px;
            border-radius: 999px;
            background: rgba(128,128,128,0.06);
        }
        .log-stat-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.7px;
            line-height: 1.15;
            max-width: 110px;
        }
        .log-stat-value {
            font-size: 30px;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
        }
        .log-stat-value.brand { color: var(--brand); }
        .log-stat-value.green { color: #16a34a; }
        .log-stat-value.yellow { color: #ca8a04; }
        .log-stat-value.red { color: #dc2626; }

        /* Countdown box — vertically centered, separate from body */
        .log-countdown {
            flex-shrink: 0;
            min-width: 240px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding: 22px 28px;
            border-radius: 22px;
            color: #fff;
        }
        .log-countdown-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            opacity: 0.9;
            margin-bottom: 8px;
            line-height: 1.2;
            display: flex;
            align-items: flex-start;
        }
        .log-countdown-label > span:first-child { display: inline-block; }
        .log-countdown-value {
            font-size: 42px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            line-height: 1;
        }
        .log-countdown.red { background: linear-gradient(135deg, #cc0000 0%, #990000 100%); box-shadow: 0 0 20px rgba(220,38,38,0.3); }
        .log-countdown.yellow { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); box-shadow: 0 0 20px rgba(217,119,6,0.25); }
        .log-countdown.green { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); box-shadow: 0 0 20px rgba(22,163,74,0.25); }
        .log-countdown.gray { background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%); }

        /* Embarque concluído — sucesso com brilho */
        @keyframes successGlow {
            0%, 100% { box-shadow: 0 0 16px rgba(22,163,74,0.4), 0 0 32px rgba(22,163,74,0.2); }
            50%      { box-shadow: 0 0 28px rgba(22,163,74,0.7), 0 0 56px rgba(22,163,74,0.35), 0 0 80px rgba(22,163,74,0.15); }
        }
        .log-countdown.success {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            animation: successGlow 2.4s ease-in-out infinite;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .log-countdown.success .log-countdown-value {
            text-shadow: 0 0 20px rgba(255,255,255,0.6);
        }

        /* Prazo expirado sem conclusão — vermelho intenso piscando */
        @keyframes overdueBlink {
            0%, 100% { background: linear-gradient(135deg, #cc0000 0%, #990000 100%); box-shadow: 0 0 18px rgba(220,38,38,0.5); }
            50%      { background: linear-gradient(135deg, #ff3333 0%, #cc0000 100%); box-shadow: 0 0 36px rgba(220,38,38,0.85), 0 0 60px rgba(220,38,38,0.4); }
        }
        @keyframes overdueShake {
            0%, 88%, 100% { transform: translateX(0); }
            90% { transform: translateX(-3px) rotate(-0.5deg); }
            92% { transform: translateX(3px) rotate(0.5deg); }
            94% { transform: translateX(-3px) rotate(-0.5deg); }
            96% { transform: translateX(3px) rotate(0.5deg); }
            98% { transform: translateX(0); }
        }
        .log-countdown.overdue-alert {
            animation: overdueBlink 1.2s ease-in-out infinite, overdueShake 2.5s ease-in-out infinite;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* Formato do countdown: "Xd Yh Zm Ws" */
        .log-countdown-value .cd-num { font-size: 38px; font-weight: 700; }
        .log-countdown-value .cd-unit { font-size: 16px; font-weight: 500; opacity: 0.75; margin-left: 1px; margin-right: 4px; }

        /* Stat clicável */
        .log-stat.clickable {
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }
        .log-stat.clickable:hover {
            background: rgba(123,26,44,0.10);
            transform: translateY(-1px);
        }

        /* Accordion de itens (expande abaixo do card de embarque) */
        .log-card-accordion {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            background: var(--card);
            border: 1px solid var(--glass-border);
            border-top: none;
            border-radius: 0 0 24px 24px;
            margin-top: -8px; /* cola visualmente no card acima */
            box-shadow: 0 6px 18px var(--shadow);
        }
        .log-card-accordion.open {
            max-height: 600px;
            overflow: auto;
        }
        .log-card-accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px 14px;
            border-bottom: 1px solid var(--card-border);
            background: rgba(123,26,44,0.04);
        }
        .log-card-accordion-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.3px;
        }
        .log-card-accordion-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }
        .log-card-accordion-close {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            width: 30px; height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex; align-items: center; justify-content: center;
        }
        .log-card-accordion-close:hover { color: var(--red); border-color: var(--red); }
        .log-card-accordion-tbl-wrap {
            width: 100%;
            overflow-x: auto;
        }
        .log-card-accordion table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            color: var(--text);
            table-layout: fixed;
            min-width: 900px;
        }
        .log-card-accordion th {
            background: rgba(123,26,44,0.07);
            text-align: left;
            padding: 12px 22px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            position: sticky; top: 0;
            border-bottom: 1px solid var(--card-border);
            z-index: 1;
            white-space: nowrap;
        }
        .log-card-accordion td {
            padding: 11px 22px;
            border-bottom: 1px solid var(--card-border);
            color: var(--text);
            word-wrap: break-word;
            overflow-wrap: anywhere;
            word-break: break-word;
            vertical-align: top;
            white-space: normal;
        }
        /* Larguras das colunas (table-layout: fixed) */
        .log-card-accordion col.c-pedido    { width: 11%; }
        .log-card-accordion col.c-fornec    { width: 18%; }
        .log-card-accordion col.c-codigo    { width: 9%; }
        .log-card-accordion col.c-acp       { width: 13%; }
        .log-card-accordion col.c-desc      { width: 32%; }
        .log-card-accordion col.c-data      { width: 11%; }
        .log-card-accordion col.c-folga     { width: 8%; }
        .log-card-accordion .td-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }
        .log-card-accordion .td-data,
        .log-card-accordion .td-pedido,
        .log-card-accordion .td-codigo {
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .log-card-accordion tbody tr:hover td { background: var(--brand-bg-hover); }
        .log-card-accordion tbody tr:last-child td { border-bottom: none; }
        .log-card-accordion-empty {
            padding: 50px 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }
        .acp-codigo-tag {
            background: rgba(123,26,44,0.10);
            color: var(--text);
            padding: 3px 8px;
            border-radius: 5px;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 12px;
            font-weight: 600;
        }

        /* Estado: prazo expirado sem conclusão (texto bem espaçado, sem label) */
        .log-countdown.overdue-alert {
            justify-content: center;
            align-items: center !important;
            padding: 20px 28px;
            text-align: center;
        }
        .log-overdue {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #fff;
            line-height: 1.3;
        }
        .log-overdue-icon {
            width: 44px; height: 44px;
            flex-shrink: 0;
        }
        .log-overdue-text {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        /* Empty state */
        .log-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* === FATURAMENTO PAGE === */
        .fat-container {
            max-width: 100%;
            padding: 24px 32px;
        }
        .fat-section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .fat-section-title::before {
            content: '';
            display: inline-block;
            width: 3px; height: 14px;
            background: var(--brand);
            border-radius: 2px;
            margin-right: 10px;
            vertical-align: middle;
        }
        /* Main progress card */
        .fat-main-card {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 28px 32px;
            margin-bottom: 24px;
            box-shadow: 0 4px 24px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .fat-main-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 32px;
        }
        .fat-main-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }
        .fat-main-values {
            font-size: 14px;
            color: var(--text-muted);
        }
        .fat-main-values strong {
            font-size: 28px;
            color: var(--text);
            font-weight: 700;
        }
        /* Progress bar */
        .fat-bar-track {
            position: relative;
            width: 100%;
            height: 48px;
            background: rgba(128,128,128,0.15);
            border-radius: 999px;
            overflow: visible;
            margin-bottom: 28px;
        }
        .fat-bar-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.6s ease, background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            position: relative;
            z-index: 2;
        }
        .fat-bar-fill.ahead { background: linear-gradient(90deg, #16a34a, #22c55e); }
        .fat-bar-fill.behind { background: linear-gradient(90deg, #dc2626, #ef4444); }
        .fat-bar-pct {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }
        /* Today marker */
        .fat-bar-marker {
            position: absolute;
            top: -8px;
            bottom: -8px;
            width: 3px;
            background: var(--text);
            z-index: 5;
            border-radius: 2px;
        }
        .fat-bar-marker::after {
            content: 'Meta hoje';
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
            background: var(--card);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--card-border);
        }
        .fat-bar-meta-pct {
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
        }
        /* Project grid */
        .fat-project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 16px;
        }
        .fat-project-card {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 20px 24px;
            box-shadow: 0 4px 24px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }
        .fat-project-card.is-clickable {
            cursor: pointer;
        }
        .fat-project-card.is-clickable:hover {
            border-color: rgba(123,26,44,0.35);
            transform: translateY(-1px);
        }
        .fat-project-card.selected {
            border-color: var(--brand);
            box-shadow: 0 8px 28px var(--shadow), 0 0 0 1px rgba(123,26,44,0.22), inset 0 1px 0 rgba(255,255,255,0.12);
        }
        .fat-proj-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
        }
        .fat-proj-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }
        .fat-proj-values {
            font-size: 12px;
            color: var(--text-muted);
        }
        .fat-proj-values strong {
            font-size: 18px;
            color: var(--text);
            font-weight: 700;
        }
        .fat-proj-bar-track {
            position: relative;
            width: 100%;
            height: 32px;
            background: rgba(128,128,128,0.15);
            border-radius: 999px;
            overflow: visible;
            margin-bottom: 8px;
        }
        .fat-proj-bar-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.6s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            position: relative;
            z-index: 2;
        }
        .fat-proj-bar-fill.ahead { background: linear-gradient(90deg, #16a34a, #22c55e); }
        .fat-proj-bar-fill.behind { background: linear-gradient(90deg, #dc2626, #ef4444); }
        .fat-proj-pct {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }
        .fat-proj-marker {
            position: absolute;
            top: -6px;
            bottom: -6px;
            width: 2px;
            background: var(--text);
            z-index: 5;
            border-radius: 2px;
        }
        .fat-proj-marker::after {
            content: 'Hoje';
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
        }
        /* Status badge on project cards */
        .fat-status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-left: 8px;
        }
        .fat-status-badge.ahead { background: rgba(22,163,74,0.15); color: #16a34a; }
        .fat-status-badge.behind { background: rgba(220,38,38,0.15); color: #dc2626; }

        /* Body padding for fixed bottom bar */
        body { padding-bottom: 36px; }
        .refresh-bar-container { bottom: 36px; }
        .refresh-info { bottom: 44px; }

        /* Responsive */
        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .header-top { flex-direction: column; gap: 8px; height: auto; padding: 16px; }
            .header-divider { display: none; }
            .container { padding: 16px; }
        }

        /* === LOGIN SCREEN === */
        .auth-screen {
            position: fixed; inset: 0; z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(123,26,44,0.35), transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(180,30,50,0.30), transparent 50%),
                linear-gradient(135deg, #1A0A10 0%, #2D111B 40%, #3D1525 70%, #1A0A10 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .auth-screen.hidden { display: none; }
        .auth-card {
            background: rgba(30,20,25,0.55);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 20px;
            padding: 44px 40px 36px;
            width: 420px; max-width: 92vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.10);
            color: #f0eaed;
        }
        .auth-logo { display: block; margin: 0 auto 28px; height: 48px; filter: brightness(0) invert(1); }
        .auth-title { text-align: center; font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .auth-sub { text-align: center; font-size: 12px; color: rgba(255,255,255,0.55); margin-bottom: 28px; text-transform: uppercase; letter-spacing: 0.5px; }
        .auth-field { margin-bottom: 14px; }
        .auth-field label {
            display: block; font-size: 11px; font-weight: 600;
            color: rgba(255,255,255,0.65); text-transform: uppercase;
            letter-spacing: 0.6px; margin-bottom: 6px;
        }
        .auth-field input {
            width: 100%; padding: 12px 14px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 10px; color: #fff; font-size: 14px; outline: none;
            transition: border-color 0.15s;
        }
        .auth-field input:focus { border-color: #B8344A; background: rgba(0,0,0,0.35); }
        .auth-error {
            background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.4);
            color: #fca5a5; padding: 10px 14px; border-radius: 8px;
            font-size: 13px; margin-bottom: 14px; text-align: center; display: none;
        }
        .auth-error.show { display: block; }
        .auth-btn {
            width: 100%; padding: 13px 18px;
            background: linear-gradient(135deg, #7B1A2C 0%, #9B2840 100%);
            color: #fff; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 700; letter-spacing: 0.5px;
            text-transform: uppercase; cursor: pointer; margin-top: 8px;
            box-shadow: 0 4px 16px rgba(123,26,44,0.45);
            transition: transform 0.1s;
        }
        .auth-btn:hover { transform: translateY(-1px); }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .auth-footer { text-align: center; font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 22px; }

        /* === ADMIN PANEL === */
        .admin-content { padding: 24px 32px; max-width: 100%; }
        .admin-section {
            background: var(--card);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 24px 28px; margin-bottom: 24px;
            box-shadow: 0 4px 24px var(--shadow);
        }
        .admin-section h3 {
            font-size: 16px; font-weight: 700; color: var(--text);
            margin-bottom: 16px; padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
        }
        .admin-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .admin-form .full { grid-column: 1 / -1; }
        .admin-form label { display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color: var(--text-muted); margin-bottom: 6px; }
        .admin-form input, .admin-form select {
            width:100%; padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--card-border);
            border-radius: 8px; color: var(--text);
            font-size: 13px; outline: none;
        }
        .admin-form input:focus, .admin-form select:focus { border-color: var(--brand); }
        .admin-btn {
            padding: 10px 20px;
            background: var(--brand); color: #fff;
            border: none; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: background 0.15s;
        }
        .admin-btn:hover { background: var(--brand-light); }
        .admin-btn.danger { background: var(--red); }
        .admin-btn.danger:hover { background: #b91c1c; }
        .admin-btn.secondary { background: transparent; border: 1px solid var(--card-border); color: var(--text); }
        .admin-perms {
            display: flex; flex-wrap: wrap; gap: 10px;
            padding: 12px; background: var(--bg);
            border-radius: 8px; border: 1px solid var(--card-border);
        }
        .admin-perm {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px;
            background: var(--card); border: 1px solid var(--card-border);
            border-radius: 999px; font-size: 12px; cursor: pointer;
            transition: all 0.15s;
        }
        .admin-perm input { margin: 0; cursor: pointer; }
        .admin-perm.checked { background: var(--brand-bg); border-color: var(--brand); color: var(--brand); font-weight: 600; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; color: var(--text); }
        .admin-table th, .admin-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--card-border); }
        .admin-table th { background: rgba(123,26,44,0.07); font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; }
        .admin-table tr:hover td { background: var(--brand-bg-hover); }
        .admin-role-pill {
            display: inline-block; padding: 3px 10px; border-radius: 999px;
            font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .admin-role-pill.admin { background: rgba(123,26,44,0.15); color: var(--brand); }
        .admin-role-pill.moderador { background: rgba(202,138,4,0.15); color: var(--yellow); }
        .admin-role-pill.usuario { background: rgba(37,99,235,0.15); color: var(--blue); }
        .admin-msg {
            padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
        }
        .admin-msg.success { background: rgba(22,163,74,0.10); color: var(--green); border: 1px solid rgba(22,163,74,0.30); }
        .admin-msg.error { background: rgba(220,38,38,0.10); color: var(--red); border: 1px solid rgba(220,38,38,0.30); }
        .admin-msg.hidden { display: none; }

        /* === ALMOXARIFADO PAGE === */
        .alm-container { padding: 32px 48px; color: var(--text); }
        .alm-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 28px; flex-wrap: wrap; gap: 16px;
        }
        .alm-header h1 { font-size: 42px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .alm-header p { font-size: 18px; color: var(--text-muted); }
        .alm-filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .alm-filters .alm-preset {
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--card-border);
            background: var(--card); color: var(--text); cursor: pointer;
            font-size: 13px; font-weight: 500; transition: all 0.15s;
        }
        .alm-filters .alm-preset:hover { border-color: var(--brand); color: var(--brand); }
        .alm-filters .alm-preset.active { background: var(--brand); color: #fff; border-color: var(--brand); }
        .alm-filters input[type=date] {
            padding: 8px 12px; border-radius: 8px; border: 1px solid var(--card-border);
            background: var(--card); color: var(--text); font-size: 13px;
        }
        .alm-filters .alm-apply {
            padding: 8px 18px; border-radius: 8px; border: none;
            background: var(--brand); color: #fff; cursor: pointer; font-weight: 600; font-size: 13px;
        }
        .alm-filters .alm-apply:hover { background: var(--brand-light); }

        .alm-kpis, .alm-kpi-grid {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px;
            margin-bottom: 16px;
        }
        .alm-section-title {
            font-size: 13px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1.2px;
            margin: 26px 0 10px 0; padding-bottom: 8px;
            border-bottom: 1.5px solid var(--card-border);
            display: flex; align-items: center; gap: 10px;
        }
        .alm-section-title:first-child { margin-top: 0; }
        .alm-section-title .alm-section-dot {
            width: 8px; height: 8px; border-radius: 50%; background: var(--brand);
        }
        .alm-section-title.itens .alm-section-dot { background: #2563EB; }
        .alm-section-title.pecas .alm-section-dot { background: #16A34A; }
        .alm-section-title.valor .alm-section-dot { background: #EA580C; }
        .alm-kpi {
            background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
            padding: 16px 18px; position: relative; overflow: hidden;
            min-width: 0;
        }
        .alm-kpi::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--brand), var(--brand-lighter));
        }
        .alm-kpi.green::before  { background: linear-gradient(90deg, #16A34A, #22C55E); }
        .alm-kpi.red::before    { background: linear-gradient(90deg, #DC2626, #EF4444); }
        .alm-kpi.blue::before   { background: linear-gradient(90deg, #2563EB, #3B82F6); }
        .alm-kpi.orange::before { background: linear-gradient(90deg, #EA580C, #F97316); }
        .alm-kpi.teal::before   { background: linear-gradient(90deg, #0D9488, #14B8A6); }
        .alm-kpi.purple::before { background: linear-gradient(90deg, #7C3AED, #A855F7); }

        /* Gráficos de linha por seção */
        .alm-chart-card {
            background: var(--card); border: 1px solid var(--card-border);
            border-radius: 12px; padding: 18px 22px; margin-bottom: 24px;
        }
        .alm-chart-card h4 {
            font-size: 13px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;
        }
        .alm-chart-wrap { position: relative; height: 280px; }
        .alm-kpi-value {
            font-size: 24px; font-weight: 700; color: var(--text); line-height: 1.15;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .alm-kpi-value.clickable {
            cursor: pointer; border-bottom: 2px dashed transparent;
            display: inline-block; transition: all 0.15s;
        }
        .alm-kpi-value.clickable:hover {
            color: var(--brand); border-bottom-color: var(--brand);
        }
        .alm-kpi-sub {
            font-size: 11px; color: var(--text-muted); margin-top: 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .alm-kpi-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .alm-kpi-label {
            font-size: 11px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* Badge de variação (verde positivo, vermelho negativo) */
        .alm-var {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 9px; border-radius: 999px;
            font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
        }
        .alm-var.up   { background: rgba(22,163,74,0.12); color: #16A34A; }
        .alm-var.down { background: rgba(220,38,38,0.12); color: #DC2626; }
        .alm-var.neutral { background: rgba(122,106,114,0.12); color: var(--text-muted); }

        /* Progress bar (para meta) */
        .alm-progress {
            height: 8px; border-radius: 999px; background: rgba(122,106,114,0.15);
            margin-top: 10px; overflow: hidden;
        }
        .alm-progress-bar {
            height: 100%; border-radius: 999px; transition: width 0.4s;
            background: linear-gradient(90deg, var(--brand), var(--brand-lighter));
        }
        .alm-progress-bar.ok    { background: linear-gradient(90deg, #16A34A, #22C55E); }
        .alm-progress-bar.warn  { background: linear-gradient(90deg, #CA8A04, #EAB308); }
        .alm-progress-bar.under { background: linear-gradient(90deg, #DC2626, #EF4444); }

        /* Card de disparidade clicável */
        .alm-disp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .alm-disp-card {
            background: var(--card); border: 1px solid var(--card-border); border-radius: 14px;
            padding: 24px 26px; position: relative; overflow: hidden;
            transition: all 0.15s;
        }
        .alm-disp-card.positiva { border-top: 4px solid #16A34A; }
        .alm-disp-card.negativa { border-top: 4px solid #DC2626; }
        .alm-disp-card h3 {
            font-size: 14px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .alm-disp-card.positiva h3 .alm-dot { background: #16A34A; }
        .alm-disp-card.negativa h3 .alm-dot { background: #DC2626; }
        .alm-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
        .alm-disp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .alm-disp-metric { }
        .alm-disp-metric-label {
            font-size: 11px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
        }
        .alm-disp-metric-value {
            font-size: 28px; font-weight: 700; color: var(--text); line-height: 1.1;
            cursor: pointer; display: inline-block;
            border-bottom: 2px dashed transparent; transition: all 0.15s;
        }
        .alm-disp-metric-value.clickable:hover {
            color: var(--brand); border-bottom-color: var(--brand);
        }
        .alm-disp-metric-sub { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

        /* Card de acuracidade */
        .alm-acc-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .alm-acc-card {
            background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
            padding: 20px 22px; position: relative; overflow: hidden;
        }
        .alm-acc-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
        }
        .alm-acc-card.total::before    { background: linear-gradient(90deg, #2563EB, #3B82F6); }
        .alm-acc-card.positiva::before { background: linear-gradient(90deg, #16A34A, #22C55E); }
        .alm-acc-card.negativa::before { background: linear-gradient(90deg, #DC2626, #EF4444); }
        .alm-acc-card h3 {
            font-size: 13px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;
        }
        .alm-acc-value { font-size: 36px; font-weight: 700; color: var(--text); line-height: 1; }
        .alm-acc-money { font-size: 14px; color: var(--text-muted); margin-top: 8px; }

        /* Modal de listagem de disparidades */
        .alm-modal-overlay {
            position: fixed; inset: 0; background: rgba(15,8,12,0.78);
            backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px;
        }
        .alm-modal-overlay.show { display: flex; }
        .alm-modal {
            background: #FFFFFF; border: 1px solid #E5DCE0; border-radius: 16px;
            width: 100%; max-width: 1100px; max-height: 88vh;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.55); color: #2D1F25;
        }
        .alm-modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 22px 28px; border-bottom: 1px solid #E5DCE0;
        }
        .alm-modal-header h3 { font-size: 20px; font-weight: 700; color: #2D1F25; }
        .alm-modal-close {
            background: transparent; border: none; font-size: 32px; line-height: 1;
            color: #7A6A72; cursor: pointer; padding: 0; width: 36px; height: 36px;
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
        }
        .alm-modal-close:hover { background: #F5F1F2; color: #2D1F25; }
        .alm-modal-body { padding: 24px 28px; overflow-y: auto; flex: 1; }

        .alm-table {
            width: 100%; border-collapse: collapse; font-size: 13px; color: #2D1F25;
        }
        .alm-table th, .alm-table td {
            padding: 10px 12px; text-align: left; border-bottom: 1px solid #E5DCE0;
        }
        .alm-table th {
            font-size: 11px; text-transform: uppercase; font-weight: 700;
            color: #7A6A72; letter-spacing: 0.5px; background: #FAF7F8;
            position: sticky; top: 0;
        }
        .alm-table td.num, .alm-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
        .alm-table tr:hover td { background: rgba(123,26,44,0.04); }
        .alm-pos { color: #16A34A; font-weight: 600; }
        .alm-neg { color: #DC2626; font-weight: 600; }
        .alm-empty {
            text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px;
        }
