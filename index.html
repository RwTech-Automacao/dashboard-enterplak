        .alm-loading { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .alm-error {
            background: rgba(220,38,38,0.10); border: 1px solid rgba(220,38,38,0.30);
            color: #DC2626; padding: 14px 18px; border-radius: 10px;
            margin-bottom: 20px; font-size: 13px;
        }
        /* Mobile (<768px) — auto-scale CSS zoom desligado, então usamos responsive normal */
        @media (max-width: 767px) {
            .alm-kpis, .alm-kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .alm-disp-row, .alm-acc-row { grid-template-columns: 1fr; }
        }

        /* === MARKETING PAGE === */
        .mkt-container { padding: 32px 48px; color: var(--text); }
        .mkt-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 28px; flex-wrap: wrap; gap: 16px;
        }
        .mkt-header h1 {
            font-size: 42px; font-weight: 700; color: var(--text); margin-bottom: 4px;
        }
        .mkt-header p { font-size: 18px; color: var(--text-muted); }
        .mkt-filters {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        }
        .mkt-filters .mkt-preset {
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--card-border);
            background: var(--card); color: var(--text); cursor: pointer;
            font-size: 13px; font-weight: 500; transition: all 0.15s;
        }
        .mkt-filters .mkt-preset:hover { border-color: var(--brand); color: var(--brand); }
        .mkt-filters .mkt-preset.active {
            background: var(--brand); color: #fff; border-color: var(--brand);
        }
        .mkt-filters input[type=date] {
            padding: 8px 12px; border-radius: 8px; border: 1px solid var(--card-border);
            background: var(--card); color: var(--text); font-size: 13px;
        }
        .mkt-filters .mkt-apply {
            padding: 8px 18px; border-radius: 8px; border: none;
            background: var(--brand); color: #fff; cursor: pointer; font-weight: 600; font-size: 13px;
        }
        .mkt-filters .mkt-apply:hover { background: var(--brand-light); }

        .mkt-kpis {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
            margin-bottom: 24px;
        }
        .mkt-kpi {
            background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
            padding: 18px 20px; position: relative; overflow: hidden;
        }
        .mkt-kpi::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--brand), var(--brand-lighter));
        }
        .mkt-kpi.green::before { background: linear-gradient(90deg, #16A34A, #22C55E); }
        .mkt-kpi.blue::before  { background: linear-gradient(90deg, #2563EB, #3B82F6); }
        .mkt-kpi.purple::before{ background: linear-gradient(90deg, #7C3AED, #A855F7); }
        .mkt-kpi.orange::before{ background: linear-gradient(90deg, #EA580C, #F97316); }
        .mkt-kpi-label {
            font-size: 12px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
        }
        .mkt-kpi-value {
            font-size: 32px; font-weight: 700; color: var(--text); line-height: 1.1;
        }
        .mkt-kpi-sub {
            font-size: 12px; color: var(--text-muted); margin-top: 6px;
        }

        .mkt-row {
            display: grid; gap: 20px; margin-bottom: 24px;
        }
        .mkt-row.split-2 { grid-template-columns: 2fr 1fr; }
        .mkt-row.split-1-1 { grid-template-columns: 1fr 1fr; }

        .mkt-card {
            background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
            padding: 22px 24px;
        }
        .mkt-card h3 {
            font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 16px;
        }
        .mkt-chart-wrap { position: relative; height: 280px; }
        .mkt-chart-wrap.tall { height: 320px; }

        .mkt-table {
            width: 100%; border-collapse: collapse; font-size: 13px; color: var(--text);
        }
        .mkt-table th, .mkt-table td {
            padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--card-border);
        }
        .mkt-table th {
            font-size: 11px; text-transform: uppercase; font-weight: 700;
            color: var(--text-muted); letter-spacing: 0.5px;
            background: rgba(123,26,44,0.07);
        }
        .mkt-table td.num, .mkt-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
        .mkt-table tr:hover td { background: var(--brand-bg-hover); }
        .mkt-status-pill {
            display: inline-block; padding: 2px 10px; border-radius: 999px;
            font-size: 10px; font-weight: 700; text-transform: uppercase;
        }
        .mkt-status-pill.enabled, .mkt-status-pill.ENABLED { background: rgba(22,163,74,0.15); color: #16A34A; }
        .mkt-status-pill.paused,  .mkt-status-pill.PAUSED  { background: rgba(202,138,4,0.15); color: #CA8A04; }
        .mkt-status-pill.removed, .mkt-status-pill.REMOVED { background: rgba(220,38,38,0.15); color: #DC2626; }
        .mkt-empty {
            text-align: center; padding: 60px 20px; color: var(--text-muted);
            font-size: 14px;
        }
        .mkt-loading {
            text-align: center; padding: 40px 20px; color: var(--text-muted);
        }
        .mkt-error {
            background: rgba(220,38,38,0.10); border: 1px solid rgba(220,38,38,0.30);
            color: #DC2626; padding: 14px 18px; border-radius: 10px;
            margin-bottom: 20px; font-size: 13px;
        }

        /* === Sub-tabs: Orgânico / Pago === */
        .mkt-subtabs {
            display: flex; gap: 4px; margin-bottom: 24px;
            border-bottom: 2px solid var(--card-border);
        }
        .mkt-subtab {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 14px 24px; background: transparent; border: none;
            font-size: 15px; font-weight: 600; color: var(--text-muted);
            cursor: pointer; border-bottom: 3px solid transparent;
            margin-bottom: -2px; transition: all 0.15s;
            font-family: inherit;
        }
        .mkt-subtab:hover { color: var(--text); }
        .mkt-subtab.active {
            color: var(--brand);
            border-bottom-color: var(--brand);
        }
        .mkt-subtab-dot {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
        }
        .mkt-subtab-dot.organic { background: #16A34A; }
        .mkt-subtab-dot.paid    { background: #EA580C; }
        @media (max-width: 1400px) {
            .mkt-kpis { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 1100px) {
            .mkt-kpis { grid-template-columns: repeat(2, 1fr); }
            .mkt-row.split-2, .mkt-row.split-1-1 { grid-template-columns: 1fr; }
        }

        /* === Modal de edição de usuário === */
        .edit-modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 8, 12, 0.78);
            backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px;
        }
        .edit-modal-overlay.show { display: flex; }
        .edit-modal {
            background: #FFFFFF;
            border: 1px solid #E5DCE0;
            border-radius: 16px;
            width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto;
            padding: 32px 36px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.55);
            color: #2D1F25;
        }
        .edit-modal h3 {
            font-size: 22px; font-weight: 700; color: #2D1F25;
            margin-bottom: 4px;
        }
        .edit-modal .edit-modal-sub {
            font-size: 13px; color: #7A6A72; margin-bottom: 22px;
            word-break: break-all;
        }
        .edit-modal label.field-label {
            display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.6px; color: #7A6A72; margin-bottom: 10px; margin-top: 20px;
        }
        .edit-modal .role-options {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }
        .edit-modal .role-opt {
            display: flex; flex-direction: column; gap: 6px;
            padding: 16px 12px; border-radius: 12px;
            border: 2px solid #E5DCE0; background: #FAF7F8;
            cursor: pointer; transition: all 0.15s;
            text-align: center;
        }
        .edit-modal .role-opt:hover {
            border-color: #9B2840; background: #FFFFFF;
        }
        .edit-modal .role-opt input { display: none; }
        .edit-modal .role-opt.selected {
            border-color: #7B1A2C;
            background: rgba(123, 26, 44, 0.08);
            box-shadow: 0 0 0 3px rgba(123, 26, 44, 0.15);
        }
        .edit-modal .role-opt .role-name {
            font-size: 15px; font-weight: 700; color: #2D1F25;
        }
        .edit-modal .role-opt.selected .role-name { color: #7B1A2C; }
        .edit-modal .role-opt .role-desc {
            font-size: 11px; color: #7A6A72; line-height: 1.35;
        }
        .edit-modal .perms-helper {
            display: flex; gap: 10px; margin-bottom: 12px;
        }
        .edit-modal .perms-helper button {
            flex: 1; padding: 9px 12px; font-size: 12px; font-weight: 600;
            border-radius: 8px; border: 1px solid #E5DCE0; background: #FFFFFF;
            color: #2D1F25; cursor: pointer; transition: all 0.15s;
        }
        .edit-modal .perms-helper button:hover {
            background: rgba(123, 26, 44, 0.06); border-color: #7B1A2C; color: #7B1A2C;
        }
        /* Override do admin-perms dentro do modal para contraste sólido */
        .edit-modal .admin-perms {
            display: flex; flex-wrap: wrap; gap: 8px;
            padding: 14px; background: #F5F1F2;
            border-radius: 10px; border: 1px solid #E5DCE0;
        }
        .edit-modal .admin-perm {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 14px;
            background: #FFFFFF; border: 1.5px solid #D9CED2;
            border-radius: 999px; font-size: 13px; cursor: pointer;
            color: #2D1F25; font-weight: 500;
            transition: all 0.15s;
        }
        .edit-modal .admin-perm:hover { border-color: #7B1A2C; }
        .edit-modal .admin-perm input { margin: 0; cursor: pointer; accent-color: #7B1A2C; }
        .edit-modal .admin-perm.checked {
            background: #7B1A2C; border-color: #7B1A2C; color: #FFFFFF; font-weight: 600;
        }
        .edit-modal .admin-perm.checked input { accent-color: #FFFFFF; }
        .edit-modal .edit-modal-actions {
            display: flex; justify-content: flex-end; gap: 10px; margin-top: 28px;
            padding-top: 20px; border-top: 1px solid #E5DCE0;
        }
        .edit-modal .edit-modal-actions button {
            padding: 11px 22px; font-size: 14px; font-weight: 600; border-radius: 8px;
            border: none; cursor: pointer; transition: all 0.15s;
        }
        .edit-modal .btn-cancel {
            background: #FFFFFF; color: #7A6A72;
            border: 1px solid #D9CED2 !important;
        }
        .edit-modal .btn-cancel:hover { color: #2D1F25; border-color: #7A6A72 !important; background: #FAF7F8; }
        .edit-modal .btn-save { background: #7B1A2C; color: #FFFFFF; }
        .edit-modal .btn-save:hover { background: #9B2840; }
        .edit-modal .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
        .edit-modal .perms-section.disabled { opacity: 0.4; pointer-events: none; }
        .edit-modal .perms-section.disabled .perms-note { display: block; }
        .edit-modal .perms-note {
            display: none; font-size: 12px; color: #7A6A72;
            margin-bottom: 10px; font-style: italic;
            padding: 8px 12px; background: rgba(123, 26, 44, 0.05);
            border-radius: 6px; border-left: 3px solid #7B1A2C;
        }
        .edit-modal .admin-msg {
            padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px;
        }
        .edit-modal .admin-msg.success { background: rgba(22,163,74,0.10); color: #15803D; border: 1px solid rgba(22,163,74,0.30); }
        .edit-modal .admin-msg.error { background: rgba(220,38,38,0.10); color: #B91C1C; border: 1px solid rgba(220,38,38,0.30); }
        .edit-modal .admin-msg.hidden { display: none; }
    </style>
</head>
<body>

<!-- === TELA DE LOGIN (Supabase) === -->
<div class="auth-screen" id="authScreen">
    <form class="auth-card" id="authForm" autocomplete="off">
        <img src="Logo_Docs.png" alt="Enterplak" class="auth-logo">
        <div class="auth-title">Dashboard Enterplak</div>
        <div class="auth-sub">Acesso restrito</div>
        <div class="auth-error" id="authError"></div>
        <div class="auth-field">
            <label for="authEmail">Email</label>
            <input type="email" id="authEmail" placeholder="seu.email@enterplak.com" autocomplete="username" required autofocus>
        </div>
        <div class="auth-field">
            <label for="authPass">Senha</label>
            <input type="password" id="authPass" placeholder="sua senha" autocomplete="current-password" required>
        </div>
        <button type="submit" class="auth-btn" id="authBtn">Entrar</button>
        <div class="auth-footer">&copy; Enterplak &middot; uso interno</div>
    </form>
</div>

<!-- === MODAL DE EDIÇÃO DE USUÁRIO === -->
<div class="edit-modal-overlay" id="editUserModal" onclick="if(event.target===this)closeEditUserModal()">
    <div class="edit-modal">
        <h3>Editar usu&aacute;rio</h3>
        <div class="edit-modal-sub" id="editUserEmail"></div>
        <div class="admin-msg hidden" id="editUserMsg"></div>

        <label class="field-label">Papel do usu&aacute;rio</label>
        <div class="role-options" id="editRoleOptions">
            <label class="role-opt" data-role="admin">
                <input type="radio" name="editRole" value="admin">
                <span class="role-name">Admin</span>
                <span class="role-desc">Acesso total + gerenciar usu&aacute;rios</span>
            </label>
            <label class="role-opt" data-role="moderador">
                <input type="radio" name="editRole" value="moderador">
                <span class="role-name">Moderador</span>
                <span class="role-desc">V&ecirc; tudo + cria/edita p&aacute;ginas</span>
            </label>
            <label class="role-opt" data-role="usuario">
                <input type="radio" name="editRole" value="usuario">
                <span class="role-name">Usu&aacute;rio</span>
                <span class="role-desc">S&oacute; as p&aacute;ginas marcadas abaixo</span>
            </label>
        </div>

        <div class="perms-section" id="editPermsSection">
            <label class="field-label">P&aacute;ginas vis&iacute;veis</label>
            <div class="perms-note">Admin e Moderador veem todas as p&aacute;ginas automaticamente.</div>
            <div class="perms-helper">
                <button type="button" onclick="editUserPermsToggleAll(true)">Marcar todas</button>
                <button type="button" onclick="editUserPermsToggleAll(false)">Desmarcar todas</button>
            </div>
            <div class="admin-perms" id="editUserPerms"></div>
        </div>

        <div class="edit-modal-actions">
            <button class="btn-cancel" onclick="closeEditUserModal()">Cancelar</button>
            <button class="btn-save" id="editUserSaveBtn" onclick="saveEditUserModal()">Salvar altera&ccedil;&otilde;es</button>
        </div>
    </div>
</div>

<!-- Hover zones for fullscreen auto-show -->
<div class="fs-hover-top" id="fsHoverTop"></div>
<div class="fs-hover-bottom" id="fsHoverBottom"></div>

<div class="header-top">
    <div class="header-left">
        <img class="logo-img" src="Logo_Docs.png" alt="Enterplak">
        <div class="header-divider"></div>
        <span class="header-title">Controle de Embarques</span>
    </div>
    <div class="header-right">

// --- Auth: login ---
async function doSupabaseLogin(email, password) {
    var errEl = document.getElementById('authError');
    var btn = document.getElementById('authBtn');
    errEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Entrando...';
    try {
        var { data, error } = await supabase.auth.signInWithPassword({ email: email.trim(), password: password });
        if (error) throw error;
        await afterAuthSuccess();
    } catch (err) {
        // Só diz "senha incorreta" quando é isso mesmo (400/invalid credentials).
        // Outros erros (projeto bloqueado por quota = 402, rede, rate limit) têm
        // causas totalmente diferentes e precisam aparecer para quem for resolver.
        var st = err && err.status;
        if (st === 402) {
            errEl.textContent = 'Projeto Supabase bloqueado por excesso de consumo. Contate o administrador.';
        } else if (st === 429) {
            errEl.textContent = 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
        } else if (st && st !== 400) {
            errEl.textContent = 'Erro no servidor de login (' + st + '): ' + (err.message || '');
        } else {
            errEl.textContent = 'Email ou senha incorretos.';
        }
        console.error('Erro de login:', err);
        errEl.classList.add('show');
        document.getElementById('authPass').value = '';
        document.getElementById('authPass').focus();
    } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
    }
}

// Chamado depois de login bem-sucedido OU se já tinha sessão na carga da página
async function afterAuthSuccess() {
    var { data: { session } } = await supabase.auth.getSession();
    if (!session) return showLoginScreen();
    currentUser = session.user;

    // Carrega profile (role)
    var { data: prof, error } = await supabase
        .from('profiles')
        .select('role, full_name, active')
        .eq('id', currentUser.id)
        .single();
    if (error || !prof) {
        alert('Erro ao carregar perfil. Contate o administrador.');
        await supabase.auth.signOut();
        showLoginScreen();
        return;
    }
    if (prof.active === false) {
        alert('Usuário desativado. Contate o administrador.');
        await supabase.auth.signOut();
        showLoginScreen();
        return;
    }
    currentProfile = prof;

    // Para 'usuario', carrega as permissões de páginas
    if (prof.role === 'usuario') {
        var { data: perms } = await supabase
            .from('user_page_permissions')
            .select('page_id')
            .eq('user_id', currentUser.id);
        allowedPageIds = new Set((perms || []).map(function(p) { return p.page_id; }));
    } else {
        allowedPageIds = null; // admin/moderador → tudo
    }

    // Esconde login, mostra dashboard
    hideLoginScreen();
    // Renderiza tabs com permissões aplicadas
    if (typeof renderPageTabs === 'function') renderPageTabs();
    // Garante que a página inicial é uma permitida (o HTML abre em 'dashboard'
    // por padrão, mesmo sem permissão — switchPage faz o fallback correto)
    if (typeof switchPage === 'function') switchPage(activePage);
    // Inicia o restante do app (uma única vez)
    if (typeof bootApp === 'function') bootApp();
}

// === AUTO-SCALE estilo Looker Studio ============================
// O dashboard foi desenhado para 1920×1080. Em telas/navegadores que
// reportam viewport menor (smart TVs, monitores 720p, navegadores com
// zoom diferente), aplicamos um zoom CSS proporcional para que tudo
// apareça com o mesmo "aspecto visual" do design original.
(function() {
    var TARGET_W = 1920;
    var BREAKPOINT_MOBILE = 768; // abaixo disso usa layout responsivo normal
    function fit() {
        var w = window.innerWidth;
        // Em mobile/tablet pequeno, deixa o CSS responsivo cuidar
        if (w < BREAKPOINT_MOBILE) {
            document.documentElement.style.zoom = '';
            return;
        }
        var scale = w / TARGET_W;
        // Se viewport >= 1920, não escala (mostra em tamanho normal)
        if (scale >= 0.999) {
            document.documentElement.style.zoom = '';
            return;
        }
        // CSS zoom funciona em WebKit/Blink/Tizen/WebOS/Android TV WebView
        document.documentElement.style.zoom = scale.toFixed(4);
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fit);
    }
    fit();
})();

async function loadData() {
    const app = document.getElementById('app');
    app.innerHTML = document.getElementById('loading').outerHTML;

    try {
        const response = await fetch(WEBHOOK_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();

        if (!Array.isArray(data) || data.length === 0) throw new Error('Webhook retornou sem dados');

        // Normaliza os registros — trim nos nomes de chaves e garante string em valores
        allData = data.map(function(row) {
            var obj = {};
            Object.keys(row).forEach(function(key) {
                var cleanKey = key.trim();
                var val = row[key];
                if (val === null || val === undefined) obj[cleanKey] = '';
                else obj[cleanKey] = String(val);
            });
            return obj;
        });

        // Pega os headers do primeiro registro
        var headers = Object.keys(allData[0]);

        renderDashboard(headers);
        document.getElementById('lastUpdate').textContent =
            'Atualizado: ' + new Date().toLocaleString('pt-BR');
    } catch (err) {
        app.innerHTML =
            '<div class="loading-overlay">' +
            '<div style="color: var(--red); font-size: 16px; font-weight: 600;">Erro ao carregar dados</div>' +
            '<div style="color: var(--text-muted); font-size: 13px;">' + err.message + '</div>' +
            '<button class="btn-refresh" onclick="loadData()" style="margin-top: 12px;">Tentar novamente</button>' +
            '</div>';
    }
}

// === HISTÓRICO DE ALERTAS (aba "histórico de alertas") ===
var historicoData = [];

function loadHistoricoAlertas() {
    var oldScript = document.getElementById('gviz-hist');
    if (oldScript) oldScript.remove();

    window.__gvizHistCallback = function(response) {
        try {
            if (response.status === 'error') return;
            var table = response.table;
            historicoData = [];
            table.rows.forEach(function(row) {
                var cellData = row.c[0];
                var cellAlertas = row.c[1];
                if (!cellData || !cellAlertas) return;
                var dataStr = cellData.f || '';
                var alertas = cellAlertas.v || 0;
                historicoData.push({ data: dataStr, alertas: alertas });
            });
            // Últimos 7 registros
            if (historicoData.length > 7) {
                historicoData = historicoData.slice(historicoData.length - 7);
            }
            renderHistoricoChart();
        } catch(e) { console.error('Erro histórico:', e); }
    };

    var script = document.createElement('script');
    script.id = 'gviz-hist';
    script.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
        '/gviz/tq?tqx=responseHandler:__gvizHistCallback&sheet=hist%C3%B3rico%20de%20alertas&range=A1:B10000&headers=1';
    document.body.appendChild(script);
}

function renderHistoricoChart() {
    var canvas = document.getElementById('historicoAlertasChart');
    if (!canvas) return;
    if (charts.historico) charts.historico.destroy();

    var labels = historicoData.map(function(d) { return d.data; });
    var values = historicoData.map(function(d) { return d.alertas; });

    var cs = getComputedStyle(document.documentElement);

    // Gradiente degradê transparente (topo sólido → base transparente)
    var ctx = canvas.getContext('2d');
    var gradient = ctx.createLinearGradient(0, 0, 0, canvas.parentElement.clientHeight || 280);
    gradient.addColorStop(0, 'rgba(220, 38, 38, 0.35)');
    gradient.addColorStop(0.5, 'rgba(220, 38, 38, 0.12)');
    gradient.addColorStop(1, 'rgba(220, 38, 38, 0.0)');

    charts.historico = new Chart(canvas, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Alertas',
                data: values,
                borderColor: '#dc2626',

// Extrai código de embarque (ex: "EMB335EA") do campo Fornecedor
function extractEmbarque(fornecedor) {
    if (!fornecedor) return '';
    var match = fornecedor.match(/^(EMB\w+)\s*-/i);
    return match ? match[1].toUpperCase() : '';
}

// Extrai data no formato YYYY-MM-DD para comparação (aceita dd/mm/yyyy e yyyy-mm-dd)
function parseDataEmbarque(val) {
    if (!val) return '';
    // formato yyyy-mm-dd
    if (/^\d{4}-\d{2}-\d{2}/.test(val)) return val.substring(0, 10);
    // formato dd/mm/yyyy
    var m = val.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    if (m) return m[3] + '-' + m[2] + '-' + m[1];
    return '';
}

// Popula os filtros do header
function setupFilters() {
    // Embarques únicos extraídos do Fornecedor
    var embarques = [...new Set(allData.map(function(d) { return extractEmbarque(d['Fornecedor']); }))].filter(Boolean).sort();
    var fe = document.getElementById('filterEmbarque');
    fe.innerHTML = '<option value="">Todos</option>';
    embarques.forEach(function(e) { var o = document.createElement('option'); o.value = e; o.textContent = e; fe.appendChild(o); });

    // Responsáveis

    var fr = document.getElementById('filterResponsavel');
    fr.innerHTML = '<option value="">Todos</option>';
    responsaveis.forEach(function(r) { var o = document.createElement('option'); o.value = r; o.textContent = r; fr.appendChild(o); });

    // Projetos (nome limpo)
    var projetos = [...new Set(allData.map(function(d) { return d['Projeto']; }))].filter(Boolean).sort();
    var fp = document.getElementById('filterProjeto');
    fp.innerHTML = '<option value="">Todos</option>';
    projetos.forEach(function(p) {
        var o = document.createElement('option');
        o.value = p;
        var pm = p.match(/\[.*?\]\s*(.*?)\s*\[/);
        o.textContent = pm ? pm[1].trim() : p;
        fp.appendChild(o);
    });

    // Listeners
    fe.addEventListener('change', applyFilters);
    fr.addEventListener('change', applyFilters);
    fp.addEventListener('change', applyFilters);
    document.getElementById('filterDataDe').addEventListener('change', applyFilters);
    document.getElementById('filterDataAte').addEventListener('change', applyFilters);
}

function applyFilters() {
    var embarque = document.getElementById('filterEmbarque').value;
    var responsavel = document.getElementById('filterResponsavel').value;
    var projeto = document.getElementById('filterProjeto').value;
    var dataDe = document.getElementById('filterDataDe').value;
    var dataAte = document.getElementById('filterDataAte').value;

    filteredData = allData.filter(function(d) {
        if (embarque && extractEmbarque(d['Fornecedor']) !== embarque) return false;
        if (responsavel && d['Responsável'] !== responsavel) return false;
        if (projeto && d['Projeto'] !== projeto) return false;
        if (dataDe || dataAte) {
            var dataRow = parseDataEmbarque(d['Data de embarque']);
            if (!dataRow) return false;
            if (dataDe && dataRow < dataDe) return false;
            if (dataAte && dataRow > dataAte) return false;
        }
        return true;
    });

    // Conta filtros ativos
    var count = 0;
    if (embarque) count++;
    if (responsavel) count++;
    if (projeto) count++;
    if (dataDe) count++;
    if (dataAte) count++;

    var badge = document.getElementById('activeFilterCount');
    if (badge) badge.innerHTML = count > 0 ? '<span class="active-filter-count">' + count + ' ativo(s)</span>' : '';

    // Tabela: só PROBLEMA NO PRAZO, ordenado por data mais recente primeiro
    tableData = filteredData.filter(function(d) {
        return d['Status'] === 'PROBLEMA NO PRAZO';
    }).sort(function(a, b) {
        var da = parseDataEmbarque(a['Data de embarque']) || '';
        var db = parseDataEmbarque(b['Data de embarque']) || '';
        return db.localeCompare(da);
    });

    // Re-renderiza TUDO com base nos dados filtrados
    renderKPIs();
    renderCharts();
    renderTable(currentHeaders);
    document.getElementById('filterInfo').textContent =
        count > 0 ? 'Filtro ativo: ' + filteredData.length + ' de ' + allData.length : '';
}

function clearAllFilters() {
    document.getElementById('filterEmbarque').value = '';
    document.getElementById('filterResponsavel').value = '';
    document.getElementById('filterProjeto').value = '';
    // Reseta "Data de" para últimos 30 dias, "Data até" vazio
    var d = new Date();
    d.setDate(d.getDate() - 30);
    document.getElementById('filterDataDe').value = d.toISOString().substring(0, 10);
    document.getElementById('filterDataAte').value = '';
    applyFilters();
}

// Table
function renderTable(headers) {
    var visibleCols = ['Projeto', 'Responsável', 'Data de embarque', 'Fornecedor', 'Embarque', 'Status', 'Tentativas', 'Status da Resposta', 'Dias Pendentes de Reposta'];
    var cols = visibleCols.filter(function(c) { return headers.includes(c); });

    var thead = document.getElementById('tableHead');
    thead.innerHTML = '<tr>' + cols.map(function(c) {
        return '<th data-col="' + c + '" onclick="sortTable(\'' + c + '\')">' + c + ' <span class="sort-icon">&#8597;</span></th>';
    }).join('') + '</tr>';

    renderTableBody();
}

function renderTableBody() {
    const visibleCols = ['Projeto', 'Responsável', 'Data de embarque', 'Fornecedor', 'Embarque', 'Status', 'Tentativas', 'Status da Resposta', 'Dias Pendentes de Reposta'];
    const tbody = document.getElementById('tableBody');

    tbody.innerHTML = tableData.map(row =>
        '<tr>' + visibleCols.map(col => {
            let val = row[col] || '';
            if (col === 'Status') val = statusBadge(val);
            else if (col === 'Data de embarque') val = formatDate(val);
            else if (col === 'Projeto') {
                const m = val.match(/\[.*?\]\s*(.*?)\s*\[/);
                val = m ? m[1].trim() : val;
            }
            return '<td>' + val + '</td>';
        }).join('') + '</tr>'
    ).join('');

    document.getElementById('rowCount').textContent = tableData.length + ' alerta(s)';
}

function sortTable(col) {
    if (sortCol === col) {
        sortAsc = !sortAsc;
    } else {
        sortCol = col;
        sortAsc = true;
    }

    tableData.sort((a, b) => {
        let va = a[col] || '', vb = b[col] || '';
        if (!isNaN(va) && !isNaN(vb) && va !== '' && vb !== '') {
            return sortAsc ? Number(va) - Number(vb) : Number(vb) - Number(va);
        }
        return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });

    document.querySelectorAll('thead th').forEach(th => {
        th.classList.toggle('sorted', th.dataset.col === col);
    });
    renderTableBody();
}

// Helpers
function countBy(arr, key) {
    return arr.reduce((acc, item) => {
        const v = item[key] || '(vazio)';
        acc[v] = (acc[v] || 0) + 1;
        return acc;
    }, {});
}

function statusBadge(status) {
    const map = {
        'OK': 'ok',
        'RESPOSTA PENDENTE': 'pendente',
        'PROBLEMA NO PRAZO': 'problema',
        'NENHUMA RESPOSTA': 'nenhuma'
    };
    const cls = map[status] || 'default';
    return '<span class="badge badge-' + cls + '">' + status + '</span>';
}

function formatDate(d) {
    if (!d) return '';
    const parts = d.split('-');
    if (parts.length === 3) return parts[2] + '/' + parts[1] + '/' + parts[0];
    return d;
}

var REFRESH_INTERVAL = 5 * 60; // 5 minutos em segundos

// === BOTÃO "ATUALIZAR" ======================================
// Antes chamava só loadData(), que recarrega apenas a aba Compras.
// Em qualquer outra aba o clique não fazia nada visível. Agora
// consulta a fonte de dados da aba que está aberta.
window.refreshPaginaAtiva = async function() {
    var btn = document.getElementById('btnRefresh');
    var txtOriginal = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Atualizando...'; }
    try {
        if (activePage === 'logistica') {
            await loadLogistica();
        } else if (activePage === 'faturamento' || activePage === 'vendas') {
            // Mesma fonte para as duas; loadFaturamento re-renderiza a aba certa
            await loadFaturamento(faturamentoMesAtual || formatMesParam(new Date()));
        } else if (activePage === 'almoxarifado') {
            await almLoadAndRender();
        } else if (activePage === 'marketing_organico' || activePage === 'marketing_pago') {
            mktState.cachedFor = null; // invalida cache para forçar nova consulta
            await mktLoadAndRender();
        } else if (activePage === 'admin') {
            await renderAdminPanel();
        } else if (window.SF && SF.isOpPageId(activePage)) {
            await loadShopfloorOps();
            if (sfFrame.op && activePage === sfFrame.opId) sfMountOp(sfFrame.op);
        } else if (activePage && activePage.indexOf('p_') === 0) {
            // Página customizada (imagem): re-sincroniza a lista com o Supabase
            await syncPagesFromAPI();
        } else {
            await loadData(); // dashboard / Compras
        }
    } catch (e) {
        console.error('Erro ao atualizar:', e);
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = txtOriginal || 'Atualizar'; }
    }
};

function startRefreshTimer() {
    refreshCountdown = REFRESH_INTERVAL;
    updateRefreshBar();
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function() {
        refreshCountdown--;
        updateRefreshBar();
        if (refreshCountdown <= 0) {
            // Reinicia o contador aqui em vez de depender de renderDashboard():
            // fora da aba Compras esse render não acontece e o timer morreria.
            refreshCountdown = REFRESH_INTERVAL;
            refreshPaginaAtiva();
        }
    }, 1000);
}

function updateRefreshBar() {
    var pct = (refreshCountdown / REFRESH_INTERVAL) * 100;
    var bar = document.getElementById('refreshBar');
    var info = document.getElementById('refreshInfo');
    if (bar) bar.style.width = pct + '%';
    if (info) {
        var min = Math.floor(refreshCountdown / 60);
        var sec = refreshCountdown % 60;
        info.textContent = 'Atualiza em ' + min + ':' + (sec < 10 ? '0' : '') + sec;
    }
}

// --- Supabase: páginas customizadas (storage para imagem, tabela "pages" para metadata) ---
const STORAGE_BUCKET = 'dashboard-pages';

// Lista APENAS as páginas customizadas (custom pages com imagem)
async function apiList() {
    var { data, error } = await supabase
        .from('pages')
        .select('id, name, type, image_url, source_type, order_idx')
        .eq('type', 'custom')
        .order('order_idx', { ascending: true });
    if (error) throw error;
    return (data || []).map(function(p) {
        return { id: p.id, name: p.name, imageUrl: p.image_url, sourceType: p.source_type };
    });
}

function newCustomPageId() {
    return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

// Faz upload da imagem no Storage e retorna a URL pública
async function uploadImageToStorage(pageId, file) {
    var extMap = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/jpg': 'jpg', 'image/gif': 'gif', 'image/webp': 'webp', 'image/svg+xml': 'svg' };
    var ext = extMap[file.type] || 'jpg';
    // Nome versionado: a URL muda só quando a imagem muda de fato, então o CDN e o
    // navegador podem cachear "para sempre" sem precisar de cache-bust periódico.
    var path = pageId + '-' + Date.now().toString(36) + '.' + ext;
    var { error } = await supabase.storage.from(STORAGE_BUCKET).upload(path, file, {
        upsert: true,
        contentType: file.type,
        cacheControl: '31536000' // 1 ano
    });
    if (error) throw error;
    var { data: { publicUrl } } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path);
    return publicUrl;
}

async function deleteImageFromStorage(imageUrl) {
    if (!imageUrl) return;
    // Extrai o path do arquivo da URL pública
    var marker = '/storage/v1/object/public/' + STORAGE_BUCKET + '/';
    var idx = imageUrl.indexOf(marker);
    if (idx === -1) return; // URL externa, não temos o que deletar
    var path = imageUrl.substring(idx + marker.length).split('?')[0];
    await supabase.storage.from(STORAGE_BUCKET).remove([path]);
}

async function apiAdd(name, fileOrUrl) {
    var id = newCustomPageId();
    var imageUrl, sourceType;
    if (fileOrUrl instanceof File) {
        imageUrl = await uploadImageToStorage(id, fileOrUrl);
        sourceType = 'file';
    } else {
        imageUrl = String(fileOrUrl).trim();
        sourceType = 'url';
    }
    var { error } = await supabase.from('pages').insert({
        id: id,
        name: name,
        type: 'custom',
        image_url: imageUrl,
        source_type: sourceType,
        order_idx: 1000 + Date.now() % 100000
    });
    if (error) throw error;
    return { id: id, name: name, imageUrl: imageUrl, sourceType: sourceType };
}

async function apiRename(id, name) {
    var { error } = await supabase.from('pages').update({ name: name }).eq('id', id);
    if (error) throw error;
}

async function apiDelete(id) {
    // Busca o registro pra remover a imagem do storage também
    var { data: pg } = await supabase.from('pages').select('image_url, source_type').eq('id', id).single();
    if (pg && pg.source_type === 'file' && pg.image_url) {
        await deleteImageFromStorage(pg.image_url);
    }
    var { error } = await supabase.from('pages').delete().eq('id', id);
    if (error) throw error;
}

async function apiReplace(id, fileOrUrl) {
    // Pega registro atual pra apagar imagem antiga (se for upload)
    var { data: pg } = await supabase.from('pages').select('image_url, source_type, name').eq('id', id).single();
    if (pg && pg.source_type === 'file' && pg.image_url) {
        await deleteImageFromStorage(pg.image_url);
    }
    var imageUrl, sourceType;
    if (fileOrUrl instanceof File) {
        imageUrl = await uploadImageToStorage(id, fileOrUrl);
        sourceType = 'file';
    } else {
        imageUrl = String(fileOrUrl).trim();
        sourceType = 'url';
    }
    var { error } = await supabase.from('pages').update({ image_url: imageUrl, source_type: sourceType }).eq('id', id);
    if (error) throw error;
    return { id: id, name: (pg && pg.name) || '', imageUrl: imageUrl, sourceType: sourceType };
}

// --- Sincronização periódica das páginas com a API ---
async function syncPagesFromAPI() {
    try {
        var serverPages = await apiList();
        // Detecta diferenças (id ou imageUrl mudados) para evitar re-render desnecessário
        var changed = serverPages.length !== customPages.length;
        if (!changed) {
            for (var i = 0; i < serverPages.length; i++) {
                var a = serverPages[i], b = customPages[i] || {};
                if (a.id !== b.id || a.name !== b.name || a.imageUrl !== b.imageUrl) { changed = true; break; }
            }
        }
        if (!changed) return false;

        customPages = serverPages;
        // Re-cria DOM das páginas customizadas
        var container = document.getElementById('customPagesContainer');
        container.innerHTML = '';
        customPages.forEach(function(pg) {
            if (pg.imageUrl) buildImagePage(pg);
            else buildEmptyPage(pg);
        });
        renderPageTabs();
        // Se a página ativa não existe mais, volta para dashboard
        if (activePage.indexOf('p') === 0 && !customPages.find(function(p) { return p.id === activePage; })) {
            switchPage('dashboard');
        }
        return true;
    } catch (e) {
        console.warn('Falha ao sincronizar páginas:', e.message);
        return false;
    }
}

    // Apenas IDs que o usuário atual pode ver

        .filter(function(id) { return canSeePage(id); });
    if (window.SF) shopfloorOps.forEach(function(op) {
        var id = SF.opPageId(op);
        if (canSeePage(id)) ids.push(id);
    });
    customPages.forEach(function(p) {

    if (pageId === 'admin' && currentProfile && currentProfile.role !== 'admin') return;

    activePage = pageId;
    document.getElementById('page-dashboard').classList.remove('active');
    document.getElementById('page-faturamento').classList.remove('active');
    document.getElementById('page-vendas').classList.remove('active');
    document.getElementById('page-logistica').classList.remove('active');
    var pgAlm = document.getElementById('page-almoxarifado');
    if (pgAlm) pgAlm.classList.remove('active');
    var pgMktO = document.getElementById('page-marketing_organico');
    var pgMktP = document.getElementById('page-marketing_pago');
    if (pgMktO) pgMktO.classList.remove('active');
    if (pgMktP) pgMktP.classList.remove('active');

    if (pgSf) pgSf.classList.remove('active');
    // Saiu da aba de OP: descarta o iframe (não deixa o Fluxo consultando o ShopFloor em segundo plano)
    if (window.SF && !SF.isOpPageId(pageId) && sfFrame.opId) sfUnmountOp();
    document.getElementById('headerFilters').style.display = pageId === 'dashboard' ? '' : 'none';

    if (pageId === 'dashboard') {
        document.getElementById('page-dashboard').classList.add('active');
    } else if (pageId === 'faturamento') {
        document.getElementById('page-faturamento').classList.add('active');
        renderFaturamento();
    } else if (pageId === 'vendas') {
        document.getElementById('page-vendas').classList.add('active');
        renderVendas();
    } else if (pageId === 'logistica') {
        document.getElementById('page-logistica').classList.add('active');
        renderLogisticaList();
    } else if (pageId === 'almoxarifado') {
        if (pgAlm) pgAlm.classList.add('active');
        renderAlmoxarifado();
    } else if (pageId === 'marketing_organico') {
        if (pgMktO) pgMktO.classList.add('active');
        renderMarketingOrganico();
    } else if (pageId === 'marketing_pago') {
        if (pgMktP) pgMktP.classList.add('active');
        renderMarketingPago();
    } else if (pageId === 'admin') {
        if (pgAdmin) pgAdmin.classList.add('active');
        renderAdminPanel();
    } else if (window.SF && SF.isOpPageId(pageId)) {
        if (pgSf) pgSf.classList.add('active');

        if (opSel && sfFrame.opId !== pageId) sfMountOp(opSel);
    } else {
        var el = document.getElementById('page-' + pageId);
        if (el) el.classList.add('active');
        var img = el ? el.querySelector('.custom-page-canvas img') : null;
        if (!img) {

        }

// --- Compress image via canvas; retorna File otimizado ---
function compressImageFile(file) {
    return new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onload = function(e) {
            var img = new Image();
            img.onload = function() {
                var maxDim = 1920;
                var w = img.width, h = img.height;
                if (w <= maxDim && h <= maxDim) { resolve(file); return; }
                if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
                else        { w = Math.round(w * maxDim / h); h = maxDim; }
                var canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                canvas.toBlob(function(blob) {
                    var name = file.name.replace(/\.[^.]+$/, '') + '.jpg';
                    resolve(new File([blob], name, { type: 'image/jpeg' }));
                }, 'image/jpeg', 0.85);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

    if (!zone) return;
    zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', function() { zone.classList.remove('dragover'); });
    zone.addEventListener('drop', async function(e) {
        e.preventDefault(); zone.classList.remove('dragover');
        if (!e.dataTransfer.files.length) return;
        var file = e.dataTransfer.files[0];
        try {
            var compressed = await compressImageFile(file);
            var existing = customPages.find(function(p) { return p.id === pageId; });
            if (existing) {
                var updated = await apiReplace(pageId, compressed);
                var idx = customPages.findIndex(function(p) { return p.id === pageId; });
                if (idx >= 0 && updated) customPages[idx] = updated;
                buildImagePage(updated);
            }
        } catch (err) {
            alert('Erro: ' + err.message);
        }
    });
}

// ============================================
// === ABAS DE OP DO SHOPFLOOR (Fluxo embutido)
// ============================================
// Cada OP ativa vira uma aba. A lista e o SSO passam pelas funções da Vercel
// (/api/shopfloor-ops e /api/shopfloor-sso), que conferem login + permissão
// 'shopfloor_fluxo' e guardam os segredos. Um iframe por vez.
var shopfloorOrigin = null;    // origem do ShopFloor, informada pelo servidor em /api/shopfloor-ops
var SF_TIMEOUT_MS = 20000;

async function sfAuthHeaders() {
    var { data: { session } } = await supabase.auth.getSession();
    return session ? { 'Authorization': 'Bearer ' + session.access_token } : null;
}

async function loadShopfloorOps() {
    if (!window.SF) return;
    if (!canSeePage('shopfloor_fluxo')) return;
    try {
        var headers = await sfAuthHeaders();
        if (!headers) return;
        var resp = await fetch('/api/shopfloor-ops', { headers: headers, cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var json = await resp.json();
        if (typeof json.origin !== 'string' || json.origin.indexOf('https://') !== 0) throw new Error('origem inválida');
        shopfloorOrigin = json.origin;
        var novas = Array.isArray(json.ops) ? json.ops : [];
        if (SF.mesmasOps(shopfloorOps, novas)) return;
        shopfloorOps = novas;
        renderPageTabs();
        // A OP aberta foi finalizada: switchPage cai na primeira aba permitida
        if (SF.isOpPageId(activePage) && !SF.acharOp(shopfloorOps, activePage)) switchPage(activePage);
    } catch (e) {
        console.warn('Falha ao carregar OPs do ShopFloor:', e.message);
    }
}

function sfUnmountOp() {
    if (sfFrame.timer) clearTimeout(sfFrame.timer);
    var page = document.getElementById('page-shopfloor-op');
    if (page) page.innerHTML = '';
    sfFrame = { el: null, opId: null, op: null, ssoTentativas: 0, timer: null };
}

function sfMountOp(op) {
    sfUnmountOp();
    var page = document.getElementById('page-shopfloor-op');
    if (!shopfloorOrigin) { sfFrame.op = op; sfFrame.opId = SF.opPageId(op); sfShowError('sso-falhou'); return; }
    page.innerHTML = '<div class="sf-op-wrap"><div class="sf-op-status" id="sfOpStatus">Carregando fluxo da OP...</div></div>';
    var iframe = document.createElement('iframe');
    iframe.className = 'sf-op-frame';
    iframe.title = SF.opLabel(op);
    iframe.setAttribute('allow', 'fullscreen');
    iframe.src = shopfloorOrigin + SF.embedPath(op);
    page.querySelector('.sf-op-wrap').appendChild(iframe);
    sfFrame = {
        el: iframe, opId: SF.opPageId(op), op: op, ssoTentativas: 0,
        timer: setTimeout(function() { sfShowError('timeout'); }, SF_TIMEOUT_MS)
    };
}

function sfShowError(codigo) {
    if (sfFrame.timer) { clearTimeout(sfFrame.timer); sfFrame.timer = null; }
    sfFrame.el = null; // mantém op/opId para o "Tentar novamente"
    var page = document.getElementById('page-shopfloor-op');
    if (!page) return;
    page.innerHTML = '<div class="sf-op-erro"><p>' + SF.escapeHtml(SF.mensagemErro(codigo)) + '</p>' +
        '<button class="btn-refresh" onclick="sfRetry()">Tentar novamente</button></div>';
}

window.sfRetry = function() {
    if (sfFrame.op) sfMountOp(sfFrame.op);
};

async function sfFazerSso(alvo) {
    alvo.ssoTentativas++;
    try {
        var headers = await sfAuthHeaders();
        if (!headers) throw new Error('sem sessão');
        headers['Content-Type'] = 'application/json';
        var resp = await fetch('/api/shopfloor-sso', {
            method: 'POST', headers: headers, cache: 'no-store',
            body: JSON.stringify({ next: SF.embedPath(alvo.op) })
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var json = await resp.json();
        // O usuário pode ter trocado de aba enquanto esperava
        if (typeof json.url !== 'string' || json.url.indexOf(shopfloorOrigin + '/embed/sso?') !== 0) throw new Error('url de SSO inválida');
        if (sfFrame === alvo && alvo.el) {
            alvo.el.src = json.url;
            // Recomeça o prazo: o SSO consumiu parte dos 20s iniciais
            if (alvo.timer) clearTimeout(alvo.timer);
            alvo.timer = setTimeout(function() { sfShowError('timeout'); }, SF_TIMEOUT_MS);
        }
    } catch (e) {
        console.warn('SSO do ShopFloor falhou:', e.message);
        if (sfFrame === alvo) sfShowError(e.message === 'HTTP 403' ? 'forbidden' : 'sso-falhou');
    }
}

window.addEventListener('message', function(ev) {
    if (!shopfloorOrigin || ev.origin !== shopfloorOrigin) return;
    if (!sfFrame.el || ev.source !== sfFrame.el.contentWindow) return;
    var d = SF.decidirAcao(ev.data, sfFrame);
    if (d.acao === 'pronto') {
        sfFrame.ssoTentativas = 0; // sessão válida: permite novo SSO se ela expirar depois
        if (sfFrame.timer) { clearTimeout(sfFrame.timer); sfFrame.timer = null; }
        var st = document.getElementById('sfOpStatus');
        if (st) st.classList.add('hidden');
    } else if (d.acao === 'sso') {
        sfFazerSso(sfFrame);
    } else if (d.acao === 'erro') {
        sfShowError(d.codigo);
    }
});

function parseUSD(val) {

    var s = String(val).replace(/\$/g, '').replace(/,/g, '').trim();
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
}

// Parse data DD/MM/YYYY ou YYYY-MM-DD para Date
function parseLogDate(val) {
    if (!val) return null;
    var s = String(val).trim();
    var m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    if (m) return new Date(parseInt(m[3]), parseInt(m[2]) - 1, parseInt(m[1]));
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
    return null;
}

function formatLogDate(d) {
    if (!d) return '—';
    var dd = String(d.getDate()).padStart(2, '0');
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    return dd + '/' + mm + '/' + d.getFullYear();
}

// Helper: ícone de ajuda discreto com tooltip ao hover
function helpIcon(html) {
    return '<span class="info-help" tabindex="0">?<span class="info-help-tip">' + html + '</span></span>';
}

// Threshold (dias mínimos de folga entre entrega do item e embarque) — define o que é crítico
function criticoThreshold(nomeEmbarque) {
    var n = String(nomeEmbarque || '').toUpperCase();
    if (n.endsWith('EA')) return 5;
    if (n.endsWith('CA') || n.endsWith('CM')) return 10;
    return 7; // padrão
}

// Determina status com base nos dias restantes até o embarque
function statusEmbarque(diasAte) {
    if (diasAte === null || diasAte === undefined || isNaN(diasAte)) {
        return { cor: 'gray', img: 'logistica1.png', label: 'SEM DATA' };
    }
    if (diasAte < 7) {
        return { cor: 'red', img: 'logistica3.png', label: 'PR\u00d3XIMO DO EMBARQUE' };
    }
    if (diasAte < 30) {
        return { cor: 'yellow', img: 'logistica2.png', label: 'AJUSTES DO EMBARQUE' };
    }
    return { cor: 'green', img: 'logistica1.png', label: 'PLANEJAMENTO DE EMBARQUE' };
}

// Carrega dados e atualiza lista
async function loadLogistica() {
    try {
        var response = await fetch(LOGISTICA_WEBHOOK, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        var data = await response.json();
        if (!Array.isArray(data)) throw new Error('Resposta inv\u00e1lida');
        logisticaData = data;

        // Embarques únicos
        var seen = {};
        logisticaEmbarques = [];
        data.forEach(function(r) {
            var p = (r['Embarque'] || '').trim();
            if (p && !seen[p]) { seen[p] = true; logisticaEmbarques.push(p); }
        });

        // Calcula resumo de cada embarque (baseado em CONTAGEM de itens)
        logisticaSummary = logisticaEmbarques.map(function(emb) {
            var rows = data.filter(function(r) { return (r['Embarque'] || '').trim() === emb; });
            var itens = rows.filter(function(r) { return r['Número'] && r['Código']; });

            var totalItens = itens.length;
            var itensRecebidos = 0;
            var itensPendentes = []; // não entregues — para o modal
            var bookingDate = null;
            var prazoDate = null;
            var concluido = false; // qualquer linha com "Embarque Concluído" preenchido

            itens.forEach(function(r) {
                if (r['Data de entrega do item'] && parseLogDate(r['Data de entrega do item'])) {
                    itensRecebidos++;
                } else {
                    itensPendentes.push({
                        pedido: r['Número'] || '',
                        fornecedor: r['Nome'] || '',
                        codigo: r['Código'] || '',
                        acp: r['Projetos'] || '',
                        descricao: r['Descrição'] || '',
                        dataPrevista: r['Data prevista para entrega do item'] || ''
                    });
                }
            });

            // Pega datas + status de conclusão + carga em trânsito
            var emTransito = false;
            // A chave da coluna G pode variar em acento/espacos — compara normalizado
            function isCargaTransitoKey(k) {
                return String(k).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toUpperCase() === 'CARGA EM TRANSITO';
            }
            for (var i = 0; i < rows.length; i++) {
                var prazoStr = rows[i]['Data de previsão do embarque'] || rows[i]['Data prevista do embarque'] || rows[i]['Data prevista de embarque'];
                if (!prazoDate && prazoStr) prazoDate = parseLogDate(prazoStr);
                if (!bookingDate && rows[i]['Booking']) bookingDate = parseLogDate(rows[i]['Booking']);
                if (!concluido && rows[i]['Embarque Concluído'] && String(rows[i]['Embarque Concluído']).trim() !== '') {
                    concluido = true;
                }
                if (!emTransito) {
                    var ks = Object.keys(rows[i]);
                    for (var ki = 0; ki < ks.length; ki++) {
                        if (isCargaTransitoKey(ks[ki]) && String(rows[i][ks[ki]]).trim().toUpperCase().indexOf('S') === 0) {
                            emTransito = true;
                            break;
                        }
                    }
                }
            }

            var pctRestante = totalItens > 0 ? ((totalItens - itensRecebidos) / totalItens) * 100 : 0;

            // Itens com data de entrega crítica (count + lista para modal)
            var refCritico = bookingDate || prazoDate;
            var threshold = criticoThreshold(emb);
            var itensCriticos = 0;
            var itensCriticosLista = [];
            if (refCritico) {
                itens.forEach(function(r) {
                    var dataPrevista = parseLogDate(r['Data prevista para entrega do item']);
                    if (!dataPrevista) return;
                    if (parseLogDate(r['Data de entrega do item'])) return; // já entregue
                    var diffDays = Math.round((refCritico - dataPrevista) / (1000 * 60 * 60 * 24));
                    if (diffDays <= threshold) {
                        itensCriticos++;
                        itensCriticosLista.push({
                            pedido: r['Número'] || '',
                            fornecedor: r['Nome'] || '',
                            codigo: r['Código'] || '',
                            acp: r['Projetos'] || '',
                            descricao: r['Descrição'] || '',
                            dataPrevista: r['Data prevista para entrega do item'] || '',
                            diff: diffDays
                        });
                    }
                });
            }

            // Status: usa data de prazo de embarque (preferencial) ou booking como fallback
            var refDate = prazoDate || bookingDate;
            var diasAte = null;
            if (refDate) {
                var hoje = new Date();
                hoje.setHours(0, 0, 0, 0);
                diasAte = Math.ceil((refDate - hoje) / (1000 * 60 * 60 * 24));
            }
            var status = statusEmbarque(diasAte);

            return {
                nome: emb,
                totalItens: totalItens,
                itensRecebidos: itensRecebidos,
                itensPendentes: itensPendentes,
                itensCriticos: itensCriticos,
                itensCriticosLista: itensCriticosLista,
                threshold: threshold,
                pctRestante: pctRestante,
                bookingDate: bookingDate,
                prazoDate: prazoDate,
                diasAte: diasAte,
                status: status,
                concluido: concluido,
                emTransito: emTransito
            };
        });

        renderLogisticaList();
    } catch (err) {
        var c = document.getElementById('logisticaContent');
        if (c) c.innerHTML = '<div class="log-empty">Erro ao carregar log\u00edstica: ' + err.message + '</div>';
    }
}

// Mantém qual accordion está aberto por embarque: { idx: tipo }
var _accordionOpen = {};

// Toggle accordion: expande/colapsa abaixo do card de embarque
function showItensModal(embIdx, tipo) {
    var acc = document.getElementById('acc-' + embIdx);
    if (!acc) return;
    var emb = logisticaSummary[embIdx];
    if (!emb) return;

    // Se já está aberto no MESMO tipo → fecha
    if (_accordionOpen[embIdx] === tipo && acc.classList.contains('open')) {
        acc.classList.remove('open');
        delete _accordionOpen[embIdx];
        // Limpa após a transição
        setTimeout(function() { if (!acc.classList.contains('open')) acc.innerHTML = ''; }, 350);
        return;
    }

    var lista = tipo === 'criticos' ? (emb.itensCriticosLista || []) : (emb.itensPendentes || []);
    var titulo = tipo === 'criticos' ? 'Itens com Entrega Crítica' : 'Itens Pendentes de Entrega';
    var sub = tipo === 'criticos'
        ? 'Data prevista está a ' + (emb.threshold || 7) + ' dias ou menos do embarque'
        : 'Itens que ainda não tiveram a Data de entrega preenchida';

    var html = '';
    html += '<div class="log-card-accordion-header">';
    html += '<div><div class="log-card-accordion-title">' + titulo + '</div>';
    html += '<div class="log-card-accordion-sub">' + sub + ' &middot; ' + lista.length + ' item(ns)</div></div>';
    html += '<button class="log-card-accordion-close" onclick="closeItensAccordion(' + embIdx + ')" title="Fechar">&times;</button>';
    html += '</div>';

    if (lista.length === 0) {
        html += '<div class="log-card-accordion-empty">&#127881; Nenhum item nesta categoria.</div>';
    } else {
        html += '<div class="log-card-accordion-tbl-wrap"><table>';
        // Larguras absolutas em px (mais previsíveis que %)
        html += '<colgroup>' +
            '<col style="width:110px">' +    // Pedido
            '<col style="width:200px">' +    // Fornecedor
            '<col style="width:115px">' +    // Código
            '<col style="width:150px">' +    // ACP
            '<col style="width:auto">' +     // Descrição (toma o resto)
            '<col style="width:115px">' +    // Data Prevista
            (tipo === 'criticos' ? '<col style="width:90px">' : '') +
            '</colgroup>';
        html += '<thead><tr>' +
            '<th>Pedido</th><th>Fornecedor</th><th>C&oacute;digo</th><th>ACP / Projeto</th><th>Descri&ccedil;&atilde;o</th><th>Data Prevista</th>' +
            (tipo === 'criticos' ? '<th>Folga</th>' : '') +
            '</tr></thead><tbody>';
        lista.forEach(function(it) {
            html += '<tr>';
            html += '<td class="td-pedido"><strong>' + (it.pedido || '-') + '</strong></td>';
            html += '<td>' + (it.fornecedor || '-') + '</td>';
            html += '<td class="td-codigo"><span class="acp-codigo-tag">' + (it.codigo || '-') + '</span></td>';
            html += '<td>' + (it.acp || '-') + '</td>';
            html += '<td class="td-desc">' + (it.descricao || '-') + '</td>';
            html += '<td class="td-data">' + (it.dataPrevista || '-') + '</td>';
            if (tipo === 'criticos') {
                var diff = (it.diff !== undefined) ? it.diff : '-';
                var color = (typeof diff === 'number' && diff < 3) ? 'var(--red)' : 'var(--yellow)';
                html += '<td><strong style="color:' + color + '">' + diff + ' dia(s)</strong></td>';
            }
            html += '</tr>';
        });
        html += '</tbody></table></div>';
    }

    acc.innerHTML = html;
    // Pequeno delay para a transição funcionar quando trocando de tipo no mesmo card
    requestAnimationFrame(function() { acc.classList.add('open'); });
    _accordionOpen[embIdx] = tipo;
}

function closeItensAccordion(embIdx) {
    var acc = document.getElementById('acc-' + embIdx);
    if (!acc) return;
    acc.classList.remove('open');
    delete _accordionOpen[embIdx];
    setTimeout(function() { if (!acc.classList.contains('open')) acc.innerHTML = ''; }, 350);
}

function updateLogisticaCountdowns() {
    document.querySelectorAll('[id^="cd-"]').forEach(function(el) {
        var box = el.closest('.log-countdown');
        if (!box) return;
        // Embarque concluído já é renderizado em estado próprio — pula
        if (box.classList.contains('success')) return;

        var targetMs = parseInt(box.getAttribute('data-target'));
        var idxAttr = box.getAttribute('data-emb-idx');
        var emb = idxAttr ? logisticaSummary[parseInt(idxAttr)] : null;

        if (!targetMs) { el.innerHTML = '—'; return; }
        var diff = targetMs - Date.now();

        // Garante label visível por padrão (caso tenha sido escondido em ciclo anterior)
        var lblEl = document.getElementById('cdLabel-' + idxAttr);
        if (lblEl && !box.classList.contains('overdue-alert')) {
            lblEl.style.display = '';
        }

        if (diff <= 0) {
            // Prazo passou e embarque NÃO concluído → estado de alerta (SVG + mensagem, sem label)
            if (emb && !emb.concluido) {
                box.classList.remove('red', 'yellow', 'green', 'gray');
                box.classList.add('overdue-alert');
                // Esconde o label "TEMPO ATÉ O ..." pois não faz mais sentido
                if (lblEl) lblEl.style.display = 'none';
                el.innerHTML =
                    '<div class="log-overdue">' +
                        '<svg class="log-overdue-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
                            '<path d="M12 2.5L1.5 21h21L12 2.5z" fill="#FACC15" stroke="#EAB308" stroke-width="1.2" stroke-linejoin="round"/>' +
                            '<rect x="11" y="9" width="2" height="6" rx="1" fill="#1f2937"/>' +
                            '<circle cx="12" cy="17.5" r="1.2" fill="#1f2937"/>' +
                        '</svg>' +
                        '<div class="log-overdue-text">Embarque<br>n&atilde;o aconteceu?</div>' +
                    '</div>';
            } else {
                el.innerHTML = '<span style="font-size:32px">0d 00h 00m 00s</span>';
            }
            return;
        }

        var totalSec = Math.floor(diff / 1000);
        var d = Math.floor(totalSec / 86400);
        var h = Math.floor((totalSec % 86400) / 3600);
        var m = Math.floor((totalSec % 3600) / 60);
        var s = totalSec % 60;
        var pad = function(n) { return String(n).padStart(2, '0'); };
        // Formato: "Xd Yh Zm Ws" com letras menores
        el.innerHTML =
            '<span class="cd-num">' + d + '</span><span class="cd-unit">d</span> ' +
            '<span class="cd-num">' + pad(h) + '</span><span class="cd-unit">h</span> ' +
            '<span class="cd-num">' + pad(m) + '</span><span class="cd-unit">m</span> ' +
            '<span class="cd-num">' + pad(s) + '</span><span class="cd-unit">s</span>';
    });
}

    var opts = [];
    for (var i = 6; i >= -11; i--) {
        var d = new Date(hoje.getFullYear(), hoje.getMonth() + i, 1);
        opts.push(formatMesParam(d));
    }
    return opts;
}

// Calcula trimestre (1-4) a partir do mês 1-12
function getTrimestre(mes) { return Math.ceil(mes / 3); }
function getMesesDoTrimestre(trim) {
    var s = (trim - 1) * 3 + 1;
    return [s, s + 1, s + 2];
}

async function loadFaturamento(mesParam) {
    faturamentoLoading = true;
    faturamentoMesAtual = mesParam;
    faturamentoProjetoSelecionado = null;
    vendasMesSelecionado = null;
    vendasTrimestre = {};
    renderFaturamento();

    try {
        // Determina os 3 meses do trimestre a partir do mês selecionado
        var partsMes = mesParam.split('/');
        var nomeMes = (partsMes[0] || '').toLowerCase();
        var anoSlug = partsMes[1] || '';
        var mesNum = MESES_NOMES.indexOf(nomeMes) + 1;
        var mesesParams = [mesParam];
        if (mesNum >= 1 && anoSlug) {
            var trim = getTrimestre(mesNum);
            mesesParams = getMesesDoTrimestre(trim).map(function(m) {
                return MESES_NOMES[m - 1] + '/' + anoSlug;
            });
        }
        // mes (selecionado) + mes2/mes3 (os outros 2 do trimestre, na ordem do trimestre)
        var outros = mesesParams.filter(function(p) { return p !== mesParam; });
        var url = FATURAMENTO_WEBHOOK + '?mes=' + encodeURIComponent(mesParam);
        if (outros[0]) url += '&mes2=' + encodeURIComponent(outros[0]);
        if (outros[1]) url += '&mes3=' + encodeURIComponent(outros[1]);

        var response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        var text = await response.text();
        if (!text || text.trim() === '') throw new Error('Webhook retornou vazio. Verifique o nó "Respond to Webhook" no n8n.');
        var data = JSON.parse(text);
        if (data.code !== undefined && data.message) throw new Error(data.message);
        faturamentoRawData = Array.isArray(data) ? data : [data];
        faturamentoData = parseFaturamentoData(data);

        // Vendas: separa por mês (col_9) — vendas vem com os 3 meses do trimestre
        mesesParams.forEach(function(mp) {
            vendasTrimestre[mp] = computeVendasRealizadasPorMes(data, mp);
        });

        // Guarda linhas brutas de vendas para o gráfico de evolução
        vendasRawData = faturamentoRawData.filter(function(r) { return r && r._source === 'vendas'; });
    } catch (err) {
        faturamentoRawData = [];
        faturamentoData = { error: err.message };
    } finally {
        faturamentoLoading = false;
        // Re-renderiza a página ativa (Faturamento ou Vendas)
        if (activePage === 'vendas') renderVendas();
        else renderFaturamento();
    }
}

// Soma valores aprovados (col_6 = "Aprovado") com base em col_3, filtrando pelo MÊS DE APROVAÇÃO
// Prioridade dos campos de mês (em ordem): col_11 (aprovação) → col_14 → col_9 (criação)
function computeVendasRealizadasPorMes(rawArr, mesParam) {
    if (!Array.isArray(rawArr)) return 0;
    var alvo = String(mesParam || '').trim().toLowerCase();
    var realizado = 0;
    rawArr.forEach(function(r) {
        if (!r || r._source !== 'vendas') return;
        var status = String(r['col_6'] || '').toLowerCase();
        if (status.indexOf('aprovad') === -1) return;
        // Mês de aprovação: usa col_11 (aprovação), com fallback para col_14, e por último col_9
        var mesRow = String(r['col_11'] || r['col_14'] || r['col_9'] || '').trim().toLowerCase();
        if (mesRow !== alvo) return;
        realizado += parseNum(r['col_3']);
    });
    return realizado;
}

// Converte número que pode vir como "1.234,56", "1234.56", número ou texto "Erro"
function parseNum(val) {
    if (val === null || val === undefined || val === '') return 0;
    if (typeof val === 'number') return val;
    var s = String(val).trim();
    // Texto não-numérico (ex: "Erro")
    if (!/[\d]/.test(s)) return 0;
    // Remove tudo exceto dígito, vírgula, ponto e hífen
    s = s.replace(/[^\d.,-]/g, '');
    // Se tem vírgula e ponto, vírgula é decimal (BR): "1.234,56" → "1234.56"
    if (s.indexOf(',') !== -1 && s.indexOf('.') !== -1) {
        s = s.replace(/\./g, '').replace(',', '.');
    } else if (s.indexOf(',') !== -1) {
        // Só vírgula → decimal
        s = s.replace(',', '.');
    }
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
}

// Converte resposta do webhook para o formato interno
// Cada projeto agora tem 4 valores:
//   - metaProducao  = Qtde planejada (Plan entregas)
//   - producao      = Qtde Embalada  (Faturamento)
//   - metaFaturamento = Total fat. Estimado (Plan entregas)
//   - faturado      = Valor total (Faturamento)
function parseFaturamentoData(raw) {
    if (!Array.isArray(raw)) raw = [raw];

    var hasSource = raw.length > 0 && raw.some(function(r) { return r && r._source; });

    if (hasSource) {
        var porCliente = {};
        function getOrInit(cliente) {
            if (!porCliente[cliente]) porCliente[cliente] = {
                nome: cliente,
                metaProducao: 0,
                producao: 0,
                metaFaturamento: 0,
                faturado: 0
            };
            return porCliente[cliente];
        }
        raw.forEach(function(row) {
            if (!row || typeof row !== 'object') return;
            var cliente = String(row['Cliente'] || '').trim();
            if (!cliente) return;
            var src = String(row._source || '').toLowerCase();

            if (src === 'previsto') {
                var qtdePlan = parseNum(row['Qtde planejada']);
                var totalEst = parseNum(row['Total fat. Estimado']);
                if (qtdePlan > 0) getOrInit(cliente).metaProducao += qtdePlan;
                if (totalEst > 0) getOrInit(cliente).metaFaturamento += totalEst;
            } else if (src === 'realizado') {
                var embalada = parseNum(row['Qtde Embalada']);
                var valorTotal = parseNum(row['Valor total']);
                if (embalada > 0) getOrInit(cliente).producao += embalada;
                if (valorTotal > 0) getOrInit(cliente).faturado += valorTotal;
            }
        });

        var projetos = Object.values(porCliente)
            .filter(function(p) {
                return p.metaProducao > 0 || p.producao > 0 || p.metaFaturamento > 0 || p.faturado > 0;
            })
            .sort(function(a, b) { return b.metaProducao - a.metaProducao; });
        var metaProducao = projetos.reduce(function(s, p) { return s + p.metaProducao; }, 0);
        var producao    = projetos.reduce(function(s, p) { return s + p.producao; }, 0);
        var metaFat     = projetos.reduce(function(s, p) { return s + p.metaFaturamento; }, 0);
        var faturado    = projetos.reduce(function(s, p) { return s + p.faturado; }, 0);
        return {
            metaProducao: metaProducao,
            producao: producao,
            metaFaturamento: metaFat,
            faturado: faturado,
            // alias para compatibilidade com código antigo
            metaTotal: metaProducao,
            realizado: producao,
            projetos: projetos
        };
    }

    // Fallback: estrutura simples (Projeto/Meta/Realizado)
    var projetos2 = [];
    var metaT = 0, realizadoT = 0;
    raw.forEach(function(row) {
        if (!row || typeof row !== 'object') return;
        var nome = row['Projeto'] || row['projeto'] || row['Nome'] || row['nome'] || '';
        var meta = parseNum(row['Meta'] || row['meta']);
        var realizado = parseNum(row['Realizado'] || row['realizado']);
        if (!nome) return;
        if (String(nome).toUpperCase().indexOf('TOTAL') !== -1) {
            metaT = meta; realizadoT = realizado;
        } else {
            projetos2.push({ nome: nome, metaProducao: meta, producao: realizado, metaFaturamento: 0, faturado: 0 });
        }
    });
    if (metaT === 0 && projetos2.length > 0) {
        metaT = projetos2.reduce(function(s,p){return s+p.metaProducao;},0);
        realizadoT = projetos2.reduce(function(s,p){return s+p.producao;},0);
    }
    return { metaProducao: metaT, producao: realizadoT, metaFaturamento: 0, faturado: 0, metaTotal: metaT, realizado: realizadoT, projetos: projetos2 };
}

// Calcula dias úteis (seg-sex) do mês inteiro
function calcDiasUteisMes(ano, mes) {
    var total = 0;
    var d = new Date(ano, mes - 1, 1);
    while (d.getMonth() === mes - 1) {
        var dow = d.getDay();
        if (dow !== 0 && dow !== 6) total++;
        d.setDate(d.getDate() + 1);
    }
    return total;
}

// Calcula dias úteis transcorridos até hoje (inclusive)
function calcDiasUteisAteHoje(ano, mes) {
    var hoje = new Date();
    var total = 0;
    var d = new Date(ano, mes - 1, 1);
    while (d.getMonth() === mes - 1 && d <= hoje) {
        var dow = d.getDay();
        if (dow !== 0 && dow !== 6) total++;
        d.setDate(d.getDate() + 1);
    }
    return total;
}

function formatBRL(valor) {
    return 'R$ ' + valor.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function selecionarProjetoFaturamento(nome) {
