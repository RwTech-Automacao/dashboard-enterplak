}

function buildFaturamentoTimeline() {
    if (!faturamentoMesAtual || !faturamentoData) return null;
    var projetoSelecionado = faturamentoProjetoSelecionado;
    var projetoData = projetoSelecionado && faturamentoData.projetos
        ? faturamentoData.projetos.find(function(p) { return p.nome === projetoSelecionado; })
        : null;
    // Meta de faturamento (Total fat. Estimado), pois o gráfico plota Valor total real
    var metaBase = projetoData
        ? (projetoData.metaFaturamento || projetoData.meta || 0)
        : (faturamentoData.metaFaturamento || faturamentoData.metaTotal || 0);
    if (!metaBase) return null;
    var partsMes = faturamentoMesAtual.split('/');
    var nomeMes = (partsMes[0] || '').toLowerCase();
    var anoSlug = partsMes[1];
    var mes = MESES_NOMES.indexOf(nomeMes) + 1;
    if (mes < 1) return null;
    var anoNum = 2000 + parseInt(anoSlug);

    var inicioMes = new Date(anoNum, mes - 1, 1);
    var fimMes = new Date(anoNum, mes, 0);
    var hoje = new Date();
    hoje.setHours(0, 0, 0, 0);
    var ate = hoje < fimMes ? hoje : fimMes;
    if (ate < inicioMes) ate = fimMes;

    var realizados = (faturamentoRawData || [])
        .filter(function(r) { return r && String(r._source || '').toLowerCase() === 'realizado'; })
        .filter(function(r) { return !projetoSelecionado || String(r['Cliente'] || '').trim() === projetoSelecionado; })
        .map(function(r) {
            var d = parseLogDate(r['Data faturada']);
            return d ? { date: d, valor: parseNum(r['Valor total']) } : null;
        })
        .filter(function(v) { return v && v.date >= inicioMes && v.date <= fimMes; })
        .sort(function(a, b) { return a.date - b.date; });

    var diasUteisMes = calcDiasUteisMes(anoNum, mes);
    var labels = [];
    var pctReal = [];
    var pctEsperado = [];
    var valorReal = [];
    var valorEsperado = [];
    var acumulado = 0;
    var idx = 0;
    var diasUteisDecorridos = 0;

    for (var d = new Date(inicioMes); d <= ate; d.setDate(d.getDate() + 1)) {
        while (idx < realizados.length && realizados[idx].date <= d) {
            acumulado += realizados[idx].valor;
            idx++;
        }
        var dow = d.getDay();
        if (dow !== 0 && dow !== 6) diasUteisDecorridos++;

        var esperadoPct = diasUteisMes > 0 ? (diasUteisDecorridos / diasUteisMes) * 100 : 0;
        labels.push(('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2));
        pctReal.push((acumulado / metaBase) * 100);
        pctEsperado.push(esperadoPct);
        valorReal.push(acumulado);
        valorEsperado.push((metaBase * esperadoPct) / 100);
    }

    return { labels: labels, real: pctReal, esperado: pctEsperado, valorReal: valorReal, valorEsperado: valorEsperado };
}

function renderFaturamentoTimelineChart() {
    var canvas = document.getElementById('faturamentoTimelineChart');
    if (!canvas) return;
    if (_faturamentoChart) { _faturamentoChart.destroy(); _faturamentoChart = null; }

    var t = buildFaturamentoTimeline();
    if (!t || t.labels.length === 0) {
        canvas.parentElement.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:13px">Sem faturamento no per&iacute;odo.</div>';
        return;
    }

    var ctx = canvas.getContext('2d');
    var h = canvas.parentElement.clientHeight || 320;
    var aheadFinal = t.real[t.real.length - 1] >= t.esperado[t.esperado.length - 1];
    var corPrincipal = aheadFinal ? '#16a34a' : '#dc2626';
    var corPrincipalRgb = aheadFinal ? '22, 163, 74' : '220, 38, 38';
    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, 'rgba(' + corPrincipalRgb + ', 0.30)');
    grad.addColorStop(0.6, 'rgba(' + corPrincipalRgb + ', 0.10)');
    grad.addColorStop(1, 'rgba(' + corPrincipalRgb + ', 0)');

    var cs = getComputedStyle(document.documentElement);
    Chart.defaults.color = cs.getPropertyValue('--chart-text').trim();
    Chart.defaults.borderColor = cs.getPropertyValue('--chart-grid').trim();

    _faturamentoChart = new Chart(canvas, {
        type: 'line',
        data: {
            labels: t.labels,
            datasets: [
                {
                    label: 'Meta esperada (linear)',
                    data: t.esperado,
                    borderColor: 'rgba(128,128,128,0.55)',
                    backgroundColor: 'transparent',
                    borderDash: [5, 5],
                    borderWidth: 1.5,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    fill: false,
                    tension: 0
                },
                {
                    label: 'Realizado',
                    data: t.real,
                    borderColor: corPrincipal,
                    backgroundColor: grad,
                    borderWidth: 3,
                    pointBackgroundColor: '#fff',
                    pointBorderColor: corPrincipal,
                    pointBorderWidth: 2.5,
                    pointRadius: 0,
                    pointHoverRadius: 6,
                    fill: true,
                    tension: 0.4
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: {
                    display: true,
                    position: 'top',
                    align: 'end',
                    labels: { padding: 16, usePointStyle: true, pointStyle: 'line', font: { size: 12 } }
                },
                tooltip: {
                    callbacks: {
                        label: function(c) {
                            var valor = c.datasetIndex === 0 ? t.valorEsperado[c.dataIndex] : t.valorReal[c.dataIndex];
                            return c.dataset.label + ': ' + c.parsed.y.toFixed(1) + '% (' + formatBRL(valor) + ')';
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: { display: false },
                    ticks: { maxTicksLimit: 12, autoSkip: true, font: { size: 10 } }
                },
                y: {
                    grid: { color: 'rgba(128,128,128,0.1)' },
                    beginAtZero: true,
                    ticks: { callback: function(v) { return v + '%'; }, font: { size: 11 } }
                }
            }
        }
    });
}

function renderFaturamentoBody() {
    if (faturamentoLoading) {
        return '<div class="loading-overlay" style="min-height:300px"><div class="spinner"></div><span style="color:var(--text-muted);font-size:14px;margin-top:12px">Carregando faturamento de ' + formatMesLabel(faturamentoMesAtual) + '...</span></div>';
    }
    if (!faturamentoData) {
        return '<div class="loading-overlay" style="min-height:200px"><div style="color:var(--text-muted);font-size:14px">Sem dados.</div></div>';
    }
    if (faturamentoData.error) {
        var errHtml = '<div class="fat-main-card" style="border:1px solid rgba(220,38,38,0.3)">';
        errHtml += '<div style="color:var(--red);font-size:16px;font-weight:600;margin-bottom:8px">Erro ao carregar dados</div>';
        errHtml += '<div style="color:var(--text-muted);font-size:13px;margin-bottom:16px">' + faturamentoData.error + '</div>';
        errHtml += '<div style="font-size:12px;color:var(--text-muted);word-break:break-all">Endpoint: <code style="background:rgba(0,0,0,0.05);padding:2px 6px;border-radius:4px;font-size:11px">' + FATURAMENTO_WEBHOOK + '?mes=' + encodeURIComponent(faturamentoMesAtual) + '</code></div>';
        errHtml += '<button class="btn-refresh" onclick="loadFaturamento(faturamentoMesAtual)" style="margin-top:12px">Tentar novamente</button>';
        errHtml += '</div>';
        return errHtml;
    }
    if (!faturamentoData.projetos || faturamentoData.projetos.length === 0) {
        return '<div class="fat-main-card"><div style="color:var(--text-muted);font-size:14px;text-align:center;padding:20px">Nenhum dado encontrado para <strong>' + formatMesLabel(faturamentoMesAtual) + '</strong>.</div></div>';
    }

    // === Cálculos baseados no mês selecionado ===
    var partsMes = faturamentoMesAtual.split('/');
    var nomeMes = (partsMes[0] || '').toLowerCase();
    var ano = 2000 + parseInt(partsMes[1] || '0');
    var mes = MESES_NOMES.indexOf(nomeMes) + 1;
    if (mes < 1) { var hojeFb = new Date(); mes = hojeFb.getMonth() + 1; ano = hojeFb.getFullYear(); }

    var diasUteisMes = calcDiasUteisMes(ano, mes);
    var diasUteisHoje = calcDiasUteisAteHoje(ano, mes);
    var hojeRef = new Date();
    var fimDoMes = new Date(ano, mes, 0);
    if (fimDoMes < hojeRef) diasUteisHoje = diasUteisMes;
    if (new Date(ano, mes - 1, 1) > hojeRef) diasUteisHoje = 0;
    var pctMetaHoje = diasUteisMes > 0 ? (diasUteisHoje / diasUteisMes) * 100 : 0;

    var data = faturamentoData;
    // M\u00e9trica principal: PRODU\u00c7\u00c3O (Qtde Embalada vs Qtde Planejada)
    var pctProducao = data.metaProducao > 0 ? (data.producao / data.metaProducao) * 100 : 0;
    var metaHojeValor = diasUteisMes > 0 ? (data.metaProducao / diasUteisMes) * diasUteisHoje : 0;
    var aheadGeral = data.producao >= metaHojeValor;
    // M\u00e9trica complementar: FATURAMENTO real (Valor total vs Total fat. Estimado)
    var pctFaturamento = data.metaFaturamento > 0 ? (data.faturado / data.metaFaturamento) * 100 : 0;

    var html = '';
    html += '<div class="fat-section-title">' + formatMesLabel(faturamentoMesAtual) + ' &mdash; Meta Geral de Produ&ccedil;&atilde;o</div>';

    // Barra principal
    html += '<div class="fat-main-card">';
    html += '<div class="fat-main-header">';
    html += '<div class="fat-main-title">Produ&ccedil;&atilde;o do M&ecirc;s';
    html += '<span class="fat-status-badge ' + (aheadGeral ? 'ahead' : 'behind') + '">' + (aheadGeral ? 'NO PRAZO' : 'ATRASADO') + '</span>';
    html += '</div>';
    html += '<div class="fat-main-values"><strong>' + pctProducao.toFixed(1) + '%</strong> produzido</div>';
    html += '</div>';

    // Barra de progresso
    html += '<div class="fat-bar-track">';
    html += '<div class="fat-bar-fill ' + (aheadGeral ? 'ahead' : 'behind') + '" style="width:' + Math.min(pctProducao, 100) + '%">';
    html += '<span class="fat-bar-pct">' + pctProducao.toFixed(1) + '%</span>';
    html += '</div>';
    html += '<div class="fat-bar-marker" style="left:' + Math.min(pctMetaHoje, 100) + '%">';
    html += '<span class="fat-bar-meta-pct">' + pctMetaHoje.toFixed(0) + '% (dia ' + diasUteisHoje + '/' + diasUteisMes + ')</span>';
    html += '</div>';
    html += '</div>';

    var diffPctGeral = pctProducao - pctMetaHoje;

// Constrói pontos da timeline de vendas: para cada dia do trimestre até hoje,
// calcula % acumulado em relação à META_VENDAS_TRIMESTRE.
function buildVendasTimeline() {
    if (!faturamentoMesAtual) return null;
    var partsMes = faturamentoMesAtual.split('/');
    var nomeMes = (partsMes[0] || '').toLowerCase();
    var anoSlug = partsMes[1];
    var mes = MESES_NOMES.indexOf(nomeMes) + 1;
    if (mes < 1) return null;
    var anoNum = 2000 + parseInt(anoSlug);
    var trim = getTrimestre(mes);

    var mesSelecionadoNum = 0;
    if (vendasMesSelecionado) {
        var partsSel = vendasMesSelecionado.split('/');
        mesSelecionadoNum = MESES_NOMES.indexOf((partsSel[0] || '').toLowerCase()) + 1;
    }
    var inicioPeriodo = mesSelecionadoNum > 0 ? new Date(anoNum, mesSelecionadoNum - 1, 1) : new Date(anoNum, (trim - 1) * 3, 1);
    var fimPeriodo = mesSelecionadoNum > 0 ? new Date(anoNum, mesSelecionadoNum, 0) : new Date(anoNum, trim * 3, 0);
    var metaPeriodo = mesSelecionadoNum > 0 ? (META_VENDAS_TRIMESTRE / 3) : META_VENDAS_TRIMESTRE;
    var hoje = new Date();
    hoje.setHours(0, 0, 0, 0);

    // Vendas aprovadas com data parseada (col_10 = data aprovação; fallback col_8)
    var aprovadas = (vendasRawData || [])
        .filter(function(r) {
            var st = String(r.col_6 || '').toLowerCase();
            return st.indexOf('aprovad') !== -1;
        })
        .map(function(r) {
            var d = parseLogDate(r.col_10) || parseLogDate(r.col_8);
            return d ? { date: d, valor: parseNum(r.col_3) } : null;
        })
        .filter(function(v) { return v && v.date >= inicioPeriodo && v.date <= fimPeriodo; })
        .sort(function(a, b) { return a.date - b.date; });

    // Total de dias úteis do trimestre
    var diasUteisTrim = 0;
    for (var dd = new Date(inicioPeriodo); dd <= fimPeriodo; dd.setDate(dd.getDate() + 1)) {
        var dw = dd.getDay();
        if (dw !== 0 && dw !== 6) diasUteisTrim++;
    }

    var ate = hoje < fimPeriodo ? hoje : fimPeriodo;
    if (ate < inicioPeriodo) ate = fimPeriodo;
    var labels = [];
    var pctReal = [];
    var pctEsperado = [];
    var acumulado = 0;
    var idx = 0;
    var diasUteisDecorridos = 0;

    for (var d = new Date(inicioPeriodo); d <= ate; d.setDate(d.getDate() + 1)) {
        // Soma vendas até este dia inclusive
        while (idx < aprovadas.length && aprovadas[idx].date <= d) {
            acumulado += aprovadas[idx].valor;
            idx++;
        }
        var dow2 = d.getDay();
        if (dow2 !== 0 && dow2 !== 6) diasUteisDecorridos++;

        var lbl = ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2);
        labels.push(lbl);
        pctReal.push((acumulado / metaPeriodo) * 100);
        pctEsperado.push(diasUteisTrim > 0 ? (diasUteisDecorridos / diasUteisTrim) * 100 : 0);
    }

    return { labels: labels, real: pctReal, esperado: pctEsperado, totalAprovadas: aprovadas.length };
}

function renderVendasTimelineChart() {
    var canvas = document.getElementById('vendasTimelineChart');
    if (!canvas) return;
    if (_vendasChart) { _vendasChart.destroy(); _vendasChart = null; }

    var t = buildVendasTimeline();
    if (!t || t.labels.length === 0) {
        canvas.parentElement.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:13px">Sem vendas aprovadas no per&iacute;odo.</div>';
        return;
    }

    var ctx = canvas.getContext('2d');
    var h = canvas.parentElement.clientHeight || 320;
    var grad = ctx.createLinearGradient(0, 0, 0, h);
    var aheadFinal = t.real[t.real.length - 1] >= t.esperado[t.esperado.length - 1];
    var corPrincipal = aheadFinal ? '#16a34a' : '#dc2626';
    var corPrincipalRgb = aheadFinal ? '22, 163, 74' : '220, 38, 38';
    grad.addColorStop(0, 'rgba(' + corPrincipalRgb + ', 0.30)');
    grad.addColorStop(0.6, 'rgba(' + corPrincipalRgb + ', 0.10)');
    grad.addColorStop(1, 'rgba(' + corPrincipalRgb + ', 0)');

    var cs = getComputedStyle(document.documentElement);
    Chart.defaults.color = cs.getPropertyValue('--chart-text').trim();
    Chart.defaults.borderColor = cs.getPropertyValue('--chart-grid').trim();

    _vendasChart = new Chart(canvas, {
        type: 'line',
        data: {
            labels: t.labels,
            datasets: [
                {
                    label: 'Meta esperada (linear)',
                    data: t.esperado,
                    borderColor: 'rgba(128,128,128,0.55)',
                    backgroundColor: 'transparent',
                    borderDash: [5, 5],
                    borderWidth: 1.5,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    fill: false,
                    tension: 0
                },
                {
                    label: 'Realizado',
                    data: t.real,
                    borderColor: corPrincipal,
                    backgroundColor: grad,
                    borderWidth: 3,
                    pointBackgroundColor: '#fff',
                    pointBorderColor: corPrincipal,
                    pointBorderWidth: 2.5,
                    pointRadius: 0,
                    pointHoverRadius: 6,
                    fill: true,
                    tension: 0.4
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: {
                    display: true,
                    position: 'top',
                    align: 'end',
                    labels: { padding: 16, usePointStyle: true, pointStyle: 'line', font: { size: 12 } }
                },
                tooltip: {
                    callbacks: {
                        label: function(c) { return c.dataset.label + ': ' + c.parsed.y.toFixed(1) + '%'; }
                    }
                }
            },
            scales: {
                x: {
                    grid: { display: false },
                    ticks: {
                        maxTicksLimit: 12,
                        autoSkip: true,
                        font: { size: 10 }
                    }
                },
                y: {
                    grid: { color: 'rgba(128,128,128,0.1)' },
                    beginAtZero: true,
                    ticks: { callback: function(v) { return v + '%'; }, font: { size: 11 } }
                }
            }
        }
    });
}

// Renderiza a seção Vendas (apenas porcentagens, sem valores absolutos)
function renderVendasSection() {
    if (!faturamentoMesAtual) return '';
    var partsMes = faturamentoMesAtual.split('/');
    var nomeMes = (partsMes[0] || '').toLowerCase();
    var anoSlug = partsMes[1];
    var mes = MESES_NOMES.indexOf(nomeMes) + 1;
    if (mes < 1) return '';
    var anoNum = 2000 + parseInt(anoSlug);
    var trim = getTrimestre(mes);
    var mesesNum = getMesesDoTrimestre(trim);
    var META_MES = META_VENDAS_TRIMESTRE / 3;

    // Realizado por mês
    var mesesDados = mesesNum.map(function(m) {
        var mp = MESES_NOMES[m - 1] + '/' + anoSlug;
        var realizado = vendasTrimestre[mp];
        var carregado = realizado !== undefined;
        if (!carregado) realizado = 0;
        return {
            num: m,
            nome: MESES_NOMES[m - 1],
            mesParam: mp,
            realizado: realizado,
            carregado: carregado,
            pct: META_MES > 0 ? (realizado / META_MES) * 100 : 0,
            isAtual: m === mes
        };
    });

    var realizadoTrim = mesesDados.reduce(function(s, m) { return s + m.realizado; }, 0);
    var pctTrim = (realizadoTrim / META_VENDAS_TRIMESTRE) * 100;

    // Marker — % de dias úteis decorridos no trimestre
    var hojeRef = new Date();
    var inicio = new Date(anoNum, (trim - 1) * 3, 1);
    var fim = new Date(anoNum, trim * 3, 0);
    var diasUteisTrim = 0, diasUteisAteHoje = 0;
    for (var d = new Date(inicio); d <= fim; d.setDate(d.getDate() + 1)) {
        var dow = d.getDay();
        if (dow !== 0 && dow !== 6) {
            diasUteisTrim++;
            if (d <= hojeRef) diasUteisAteHoje++;
        }
    }
    if (fim < hojeRef) diasUteisAteHoje = diasUteisTrim;
    if (inicio > hojeRef) diasUteisAteHoje = 0;
    var pctMetaHoje = diasUteisTrim > 0 ? (diasUteisAteHoje / diasUteisTrim) * 100 : 0;
    var aheadTrim = pctTrim >= pctMetaHoje;

    var TRIM_LABELS = ['', '1º Trim', '2º Trim', '3º Trim', '4º Trim'];

    var html = '';
    html += '<div class="fat-section-title">' + TRIM_LABELS[trim] + ' / ' + anoSlug + '</div>';

    // Card geral do trimestre
    html += '<div class="fat-main-card">';
    html += '<div class="fat-main-header">';
    html += '<div class="fat-main-title">Meta de Vendas do Trimestre';
    html += '<span class="fat-status-badge ' + (aheadTrim ? 'ahead' : 'behind') + '">' + (aheadTrim ? 'NO PRAZO' : 'ATRASADO') + '</span>';
    html += '</div>';
    html += '<div class="fat-main-values"><strong>' + pctTrim.toFixed(1) + '%</strong> da meta</div>';
    html += '</div>';

    html += '<div class="fat-bar-track">';
    html += '<div class="fat-bar-fill ' + (aheadTrim ? 'ahead' : 'behind') + '" style="width:' + Math.min(pctTrim, 100) + '%">';
    html += '<span class="fat-bar-pct">' + pctTrim.toFixed(1) + '%</span>';
    html += '</div>';
    html += '<div class="fat-bar-marker" style="left:' + Math.min(pctMetaHoje, 100) + '%">';
    html += '<span class="fat-bar-meta-pct">' + pctMetaHoje.toFixed(0) + '% (dia &uacute;til ' + diasUteisAteHoje + '/' + diasUteisTrim + ')</span>';
    html += '</div>';
    html += '</div>';

    var diffPct = pctTrim - pctMetaHoje;
    html += '<div style="margin-top:8px;font-size:12px;color:var(--text-muted)">Meta para hoje: ' + pctMetaHoje.toFixed(1) + '% &mdash; Diferença: <strong style="color:' + (aheadTrim ? 'var(--green)' : 'var(--red)') + '">' + (diffPct >= 0 ? '+' : '') + diffPct.toFixed(1) + ' p.p.</strong></div>';
    html += '</div>';

    // Gráfico de evolução de vendas (acumulado % ao longo do trimestre, até hoje)
    var tituloGraficoVendas = vendasMesSelecionado
        ? 'Evolu&ccedil;&atilde;o das Vendas - ' + formatMesLabel(vendasMesSelecionado)
        : 'Evolu&ccedil;&atilde;o das Vendas no Trimestre';
    html += '<div class="chart-card" style="margin-bottom:24px"><h3>' + tituloGraficoVendas + '</h3><div class="chart-container" style="height:320px"><canvas id="vendasTimelineChart"></canvas></div></div>';
    setTimeout(renderVendasTimelineChart, 50);

    // Cards mensais — meta de cada mês = 1/3 da meta trimestral
    html += '<div class="fat-section-title">Por M&ecirc;s &mdash; Meta de Vendas Mensal (1/3 do trimestre)</div>';
    html += '<div class="fat-project-grid">';
    mesesDados.forEach(function(md) {
        // Meta esperada do mês (% do mês decorrido)
        var pctEsperado;
        if (md.num < mes) {
            pctEsperado = 100; // mês passado: deveria estar em 100%
        } else if (md.num > mes) {
            pctEsperado = 0;   // mês futuro: ainda não deveria ter
        } else {
            // mês atual: % de dias úteis decorridos no mês
            var inicioM = new Date(anoNum, md.num - 1, 1);
            var fimM = new Date(anoNum, md.num, 0);
            var dum = 0, duh = 0;
            for (var dd = new Date(inicioM); dd <= fimM; dd.setDate(dd.getDate() + 1)) {
                var dw = dd.getDay();
                if (dw !== 0 && dw !== 6) {
                    dum++;
                    if (dd <= hojeRef) duh++;
                }
            }
            pctEsperado = dum > 0 ? (duh / dum) * 100 : 0;
        }
        var aheadM = md.pct >= pctEsperado;
        var nomeCap = md.nome.charAt(0).toUpperCase() + md.nome.slice(1);

        var cardClasses = 'fat-project-card is-clickable' + (vendasMesSelecionado === md.mesParam ? ' selected' : '');
        var cardStyle = md.isAtual && vendasMesSelecionado !== md.mesParam ? ' style="border-color:rgba(123,26,44,0.4)"' : '';
        html += '<div class="' + cardClasses + '"' + cardStyle + ' onclick="selecionarMesVendas(\'' + md.mesParam + '\')">';
        html += '<div class="fat-proj-header">';
        html += '<div class="fat-proj-name">' + nomeCap + '/' + anoSlug;
        html += '<span class="fat-status-badge ' + (aheadM ? 'ahead' : 'behind') + '">' + (aheadM ? 'NO PRAZO' : 'ATRASADO') + '</span>';
        if (md.isAtual) html += '<span style="font-size:10px;color:var(--brand);margin-left:6px;font-weight:700;letter-spacing:0.5px">ATUAL</span>';
        html += '</div>';
        html += '<div class="fat-proj-values"><strong>' + md.pct.toFixed(1) + '%</strong> da meta</div>';
        html += '</div>';
        html += '<div class="fat-proj-bar-track">';
        html += '<div class="fat-proj-bar-fill ' + (aheadM ? 'ahead' : 'behind') + '" style="width:' + Math.min(md.pct, 100) + '%">';
        html += '<span class="fat-proj-pct">' + md.pct.toFixed(1) + '%</span>';
        html += '</div>';
        if (pctEsperado > 0 && pctEsperado < 100) {
            html += '<div class="fat-proj-marker" style="left:' + Math.min(pctEsperado, 100) + '%"></div>';
        }
        html += '</div>';
        var diffPctM = md.pct - pctEsperado;
        html += '<div style="margin-top:6px;font-size:11px;color:var(--text-muted)">Meta esperada: ' + pctEsperado.toFixed(1) + '% &mdash; <strong style="color:' + (aheadM ? 'var(--green)' : 'var(--red)') + '">' + (diffPctM >= 0 ? '+' : '') + diffPctM.toFixed(1) + ' p.p.</strong></div>';
        html += '</div>';
    });
    html += '</div>';

    return html;
}

// Init pages — busca lista do servidor (api.php)
async function initPages() {
    // Carrega nomes das abas fixas do Supabase (sincronizado)
    await loadFixedTabLabels();
    renderPageTabs();
    try {
        customPages = await apiList();
    } catch (e) {
        console.warn('Não foi possível carregar páginas do Supabase:', e.message);
        customPages = [];
    }
    customPages.forEach(function(pg) {
        if (pg.imageUrl) buildImagePage(pg);
        else buildEmptyPage(pg);
    });
    renderPageTabs();
    // Realtime: quando alguém criar/editar/deletar uma página, recarrega
    supabase.channel('pages-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'pages' }, async function() {
            await loadFixedTabLabels();
            try { customPages = await apiList(); } catch(e) {}
            // Recria DOM das custom pages
            var container = document.getElementById('customPagesContainer');
            if (container) container.innerHTML = '';
            customPages.forEach(function(pg) {
                if (pg.imageUrl) buildImagePage(pg);
                else buildEmptyPage(pg);
            });
            renderPageTabs();
        })
        .subscribe();
    // Carrega os embarques de logística — vai popular as abas quando chegar
    loadLogistica();
    setInterval(loadLogistica, 5 * 60 * 1000);
}

function mktFormatDate(d) {
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + dd;
}
function mktNumberBR(n) {
    if (n === null || n === undefined || isNaN(n)) return '0';
    return Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
}
function mktMoneyBR(n) {
    if (n === null || n === undefined || isNaN(n)) return 'R$ 0,00';
    return 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function mktPctBR(n, decimals) {
    if (n === null || n === undefined || isNaN(n)) return '0%';
    return Number(n).toLocaleString('pt-BR', { minimumFractionDigits: decimals||0, maximumFractionDigits: decimals||2 }) + '%';
}
function mktDuration(seconds) {
    seconds = Number(seconds) || 0;
    var m = Math.floor(seconds / 60), s = Math.floor(seconds % 60);
    return m + 'm ' + String(s).padStart(2,'0') + 's';
}

function mktApplyPreset(preset) {
    var today = new Date(); today.setHours(0,0,0,0);
    var start = new Date(today), end = new Date(today);
    if (preset === '7d') {
        start.setDate(today.getDate() - 6);
    } else if (preset === '30d') {
        start.setDate(today.getDate() - 29);
    } else if (preset === 'mes_atual') {
        start = new Date(today.getFullYear(), today.getMonth(), 1);
    } else if (preset === 'mes_anterior') {
        start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        end = new Date(today.getFullYear(), today.getMonth(), 0);
    } else if (preset === '90d') {
        start.setDate(today.getDate() - 89);
    }
    mktState.startDate = mktFormatDate(start);
    mktState.endDate = mktFormatDate(end);
    mktState.activePreset = preset;
}

function _mktCurrentView() {
    return activePage === 'marketing_pago' ? 'pago' : 'organico';
}

window.mktSelectPreset = function(preset) {
    mktApplyPreset(preset);
    ['organico','pago'].forEach(function(v) {
        var sEl = document.getElementById('mktStart_' + v);
        var eEl = document.getElementById('mktEnd_'   + v);
        if (sEl) sEl.value = mktState.startDate;
        if (eEl) eEl.value = mktState.endDate;
    });
    mktState.cachedFor = null;
    mktLoadAndRender();
};

window.mktApplyCustom = function(view) {
    view = view || _mktCurrentView();
    var s = document.getElementById('mktStart_' + view).value;
    var e = document.getElementById('mktEnd_'   + view).value;
    if (!s || !e) { alert('Selecione data início e fim.'); return; }
    if (s > e) { alert('A data inicial não pode ser maior que a final.'); return; }
    mktState.startDate = s; mktState.endDate = e; mktState.activePreset = 'custom';
    mktState.cachedFor = null;
    mktLoadAndRender();
};

async function renderMarketingOrganico() { return _renderMarketingView('organico'); }
async function renderMarketingPago()     { return _renderMarketingView('pago'); }

async function _renderMarketingView(view) {
    if (!mktState.startDate) mktApplyPreset('30d');
    var elId = view === 'organico' ? 'mktOrganicContent' : 'mktPaidContent';
    var el = document.getElementById(elId);
    if (!el) return;

    var title = view === 'organico' ? 'Marketing Orgânico' : 'Marketing Pago';
    var sub   = view === 'organico'
        ? 'Tráfego sem investimento publicitário — Enterplak'
        : 'Investimento em mídia paga (Google Ads via GA4) — Enterplak';

    el.innerHTML = ''
        + '<div class="mkt-header">'
        +     '<div>'
        +         '<h1>' + title + '</h1>'
        +         '<p>' + sub + '</p>'
        +     '</div>'
        +     '<div class="mkt-filters">'
        +         mktPresetBtn('7d',  '7 dias')
        +         mktPresetBtn('30d', '30 dias')
        +         mktPresetBtn('90d', '90 dias')
        +         mktPresetBtn('mes_atual',     'Mês atual')
        +         mktPresetBtn('mes_anterior',  'Mês anterior')
        +         '<input type="date" id="mktStart_' + view + '" value="' + mktState.startDate + '">'
        +         '<input type="date" id="mktEnd_'   + view + '" value="' + mktState.endDate   + '">'
        +         '<button class="mkt-apply" onclick="mktApplyCustom(\'' + view + '\')">Aplicar</button>'
        +     '</div>'
        + '</div>'
        + '<div id="mktBody_' + view + '"><div class="mkt-loading">Carregando dados...</div></div>';

    // Se já temos dados em cache (de uma renderização anterior na outra view),
    // renderiza imediatamente. Senão, busca.
    if (mktState.data && mktState.cachedFor === mktState.startDate + '_' + mktState.endDate) {
        _mktRenderView(view, mktState.data);
    } else {
        await mktLoadAndRender();
    }
}

function mktPresetBtn(preset, label) {
    var active = mktState.activePreset === preset ? ' active' : '';
    return '<button class="mkt-preset' + active + '" onclick="mktSelectPreset(\'' + preset + '\')">' + label + '</button>';
}

async function mktLoadAndRender() {
    var view = _mktCurrentView();
    var body = document.getElementById('mktBody_' + view);
    if (body) body.innerHTML = '<div class="mkt-loading">Carregando dados de ' + mktState.startDate + ' a ' + mktState.endDate + '...</div>';

    try {
        var url = MKT_WEBHOOK + '?startDate=' + mktState.startDate + '&endDate=' + mktState.endDate;
        var resp = await fetch(url, { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var data = await resp.json();
        mktState.data = data;
        mktState.cachedFor = mktState.startDate + '_' + mktState.endDate;
        _mktRenderView(view, data);
    } catch (err) {
        if (body) body.innerHTML = '<div class="mkt-error">Erro ao buscar dados: ' + (err.message || err) + '</div>';
    }
}

// Renderiza uma view específica (chamada tanto por load quanto por cache)
function _mktRenderView(view, data) {
    var body = document.getElementById('mktBody_' + view);
    if (!body) return;
    var dbg = data.debug || {};

    var errs = [];
    if (dbg.ga4DailyError)     errs.push('GA4 diário: ' + dbg.ga4DailyError);
    if (dbg.ga4ChannelError)   errs.push('GA4 canais: ' + dbg.ga4ChannelError);
    if (dbg.ga4DeviceError)    errs.push('GA4 dispositivos: ' + dbg.ga4DeviceError);
    if (dbg.ga4PagesError)     errs.push('GA4 páginas: ' + dbg.ga4PagesError);
    if (dbg.adsDailyError)     errs.push('Ads diário: ' + dbg.adsDailyError);
    if (dbg.adsCampaignsError) errs.push('Ads campanhas: ' + dbg.adsCampaignsError);
    var errHtml = errs.length > 0
        ? '<div class="mkt-error"><strong>Avisos da API:</strong><br>' + errs.join('<br>') + '</div>'
        : '';

    // Destrói TODOS os gráficos antigos antes de renderizar (canvases podem ter ido pro lixo)
    Object.values(mktState.charts).forEach(function(c) { try { c.destroy(); } catch(e){} });
    mktState.charts = {};

    if (view === 'organico') {
        body.innerHTML = errHtml + mktBuildOrganicHtml(data);
        setTimeout(function() {
            mktRenderChartOrganicTime(data.timeSeries || []);
            mktRenderChartOrganicChannel(data.byChannel || []);
            mktRenderChartDevice(data.byDevice || []);
        }, 0);
    } else {
        body.innerHTML = errHtml + mktBuildPaidHtml(data);
        setTimeout(function() {
            mktRenderChartPaidTime(data.timeSeries || []);
            mktRenderChartPaidChannel(data.byChannel || []);
        }, 0);
    }
}

// Canais considerados "pagos" pelo GA4. Tudo que não estiver aqui é tratado como orgânico/direto.
var MKT_PAID_CHANNELS = ['Paid Search', 'Paid Social', 'Paid Video', 'Paid Shopping', 'Paid Other', 'Cross-network', 'Display'];

function mktIsPaidChannel(channel) {
    return MKT_PAID_CHANNELS.indexOf(channel) !== -1;
}

// ============================================================
// === Marketing Orgânico ====================================
// ============================================================
function mktBuildOrganicHtml(data) {
    var s = data.summary || {};
    var byChannel = (data.byChannel || []).filter(function(c) { return !mktIsPaidChannel(c.channel); });
    var orgSessions = byChannel.reduce(function(a, c) { return a + (c.sessions || 0); }, 0);
    var orgUsers    = byChannel.reduce(function(a, c) { return a + (c.activeUsers || 0); }, 0);
    var totalSessions = (data.byChannel || []).reduce(function(a, c) { return a + (c.sessions || 0); }, 0);
    var orgShare = totalSessions > 0 ? (orgSessions / totalSessions) * 100 : 0;

    var html = ''
        // KPIs Orgânico
        + '<div class="mkt-kpis">'
        +     mktKpi('Sessões orgânicas', mktNumberBR(orgSessions), mktPctBR(orgShare, 1) + ' do total', 'green')
        +     mktKpi('Usuários',          mktNumberBR(orgUsers),    mktNumberBR(s.newUsers) + ' novos no total', 'blue')
        +     mktKpi('Páginas vistas',    mktNumberBR(s.pageViews), '', 'purple')
        +     mktKpi('Tx. rejeição',      mktPctBR((s.bounceRate||0)*100, 1), 'Duração méd.: ' + mktDuration(s.avgSessionDuration), 'orange')
        + '</div>'
        // Linha — gráfico de tempo + donut canais orgânicos
        + '<div class="mkt-row split-2">'
        +     '<div class="mkt-card"><h3>Sessões orgânicas por dia</h3><div class="mkt-chart-wrap tall"><canvas id="mktChartOrgTime"></canvas></div></div>'
        +     '<div class="mkt-card"><h3>Sessões por canal orgânico</h3><div class="mkt-chart-wrap tall"><canvas id="mktChartOrgChannel"></canvas></div></div>'
        + '</div>'
        // Linha — dispositivos + tabela canais
        + '<div class="mkt-row split-1-1">'
        +     '<div class="mkt-card"><h3>Dispositivos</h3><div class="mkt-chart-wrap"><canvas id="mktChartDevice"></canvas></div></div>'
        +     '<div class="mkt-card"><h3>Detalhamento por canal</h3>' + mktChannelTableHtml(byChannel) + '</div>'
        + '</div>'
        // Top páginas
        + '<div class="mkt-card" style="margin-bottom:24px"><h3>Top 10 páginas mais vistas</h3>' + mktTopPagesTableHtml(data.topPages) + '</div>';
    return html;
}

// ============================================================
// === Marketing Pago ========================================
// ============================================================
function mktBuildPaidHtml(data) {
    var s = data.summary || {};
    var byChannelPaid = (data.byChannel || []).filter(function(c) { return mktIsPaidChannel(c.channel); });
    var paidSessions = byChannelPaid.reduce(function(a, c) { return a + (c.sessions || 0); }, 0);
    var totalSessions = (data.byChannel || []).reduce(function(a, c) { return a + (c.sessions || 0); }, 0);
    var paidShare = totalSessions > 0 ? (paidSessions / totalSessions) * 100 : 0;

    var hasAdsData = (s.adSpend || 0) > 0 || (s.clicks || 0) > 0 || (s.impressions || 0) > 0;
    var pendingNote = '';
    if (!hasAdsData) {
        pendingNote = '<div class="mkt-error" style="background:rgba(202,138,4,0.10);color:#CA8A04;border-color:rgba(202,138,4,0.30)">'
            + '<strong>Aguardando dados do Google Ads.</strong><br>'
            + 'A vinculação GA4 ↔ Google Ads foi criada. Pode levar até 24h para o Google importar os dados de custo das campanhas.'
            + '</div>';
    }

    var html = pendingNote
        // KPIs Pago — sem Receita, sem ROAS (a pedido)
        + '<div class="mkt-kpis">'
        +     mktKpi('Investimento',  mktMoneyBR(s.adSpend),         mktNumberBR(paidSessions) + ' sessões pagas (' + mktPctBR(paidShare,1) + ')', 'orange')
        +     mktKpi('Cliques',       mktNumberBR(s.clicks),         mktNumberBR(s.impressions) + ' impressões', 'blue')
        +     mktKpi('CTR',           mktPctBR(s.ctr, 2),            'CPC médio: ' + mktMoneyBR(s.cpc), 'purple')
        +     mktKpi('Conversões',    mktNumberBR(s.adsConversions), 'CPA: ' + mktMoneyBR(s.cpa), 'green')
        + '</div>'
        // Gráfico de tempo (investimento + cliques) + Pizza canais pagos
        + '<div class="mkt-row split-2">'
        +     '<div class="mkt-card"><h3>Investimento e cliques por dia</h3><div class="mkt-chart-wrap tall"><canvas id="mktChartPaidTime"></canvas></div></div>'
        +     '<div class="mkt-card"><h3>Sessões por canal pago</h3><div class="mkt-chart-wrap tall"><canvas id="mktChartPaidChannel"></canvas></div></div>'
        + '</div>'
        // Tabela de canais pagos
        + '<div class="mkt-card" style="margin-bottom:24px"><h3>Detalhamento por canal pago</h3>' + mktChannelTableHtml(byChannelPaid) + '</div>'
        // Tabela completa de campanhas Ads
        + '<div class="mkt-card" style="margin-bottom:24px"><h3>Campanhas Google Ads</h3>' + mktCampaignsTableHtml(data.ads) + '</div>';
    return html;
}

// === Tabela auxiliar — canais (orgânico ou pago) ===========
// ============================================================
function mktChannelTableHtml(channels) {
    if (!channels || channels.length === 0) {
        return '<div class="mkt-empty">Sem dados de canais no período.</div>';
    }
    var total = channels.reduce(function(a, c) { return a + (c.sessions || 0); }, 0);
    var html = '<table class="mkt-table">'
        + '<thead><tr>'
        +   '<th>Canal</th>'
        +   '<th class="num">Sessões</th>'
        +   '<th class="num">Usuários</th>'
        +   '<th class="num">Share</th>'
        + '</tr></thead><tbody>';
    channels.forEach(function(c) {
        var pct = total > 0 ? (c.sessions / total) * 100 : 0;
        html += '<tr>'
            + '<td><strong>' + c.channel + '</strong></td>'
            + '<td class="num">' + mktNumberBR(c.sessions) + '</td>'
            + '<td class="num">' + mktNumberBR(c.activeUsers) + '</td>'
            + '<td class="num">' + mktPctBR(pct, 1) + '</td>'
            + '</tr>';
    });
    html += '</tbody></table>';
    return html;
}

function mktKpi(label, value, sub, variant) {
    var cls = variant ? ' ' + variant : '';
    return '<div class="mkt-kpi' + cls + '">'
         +   '<div class="mkt-kpi-label">' + label + '</div>'
         +   '<div class="mkt-kpi-value">' + value + '</div>'
         + (sub ? '<div class="mkt-kpi-sub">' + sub + '</div>' : '')
         + '</div>';
}

function mktAdsTotalsHtml(s) {
    var rows = [
        ['Impressões', mktNumberBR(s.impressions)],
        ['Cliques', mktNumberBR(s.clicks)],
        ['CTR', mktPctBR(s.ctr, 2)],
        ['CPC médio', mktMoneyBR(s.cpc)],
        ['CPA', mktMoneyBR(s.cpa)],
        ['ROAS', (s.roas || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + 'x']
    ];
    var html = '<table class="mkt-table">';
    rows.forEach(function(r) {
        html += '<tr><td style="color:var(--text-muted);font-weight:600">' + r[0] + '</td><td class="num" style="font-weight:700;font-size:15px">' + r[1] + '</td></tr>';
    });
    html += '</table>';
    return html;

function mktDateLabel(d) {
    var s = String(d.date || '');
    if (s.indexOf('-') !== -1) { var p = s.split('-'); return p[2] + '/' + p[1]; }
    if (s.length === 8) return s.slice(6,8) + '/' + s.slice(4,6);
    return s;
}
function mktDonutLabel(ctx) {
    var total = ctx.dataset.data.reduce(function(a,b){return a+b;}, 0);
    var v = ctx.parsed;
    var pct = total > 0 ? (v/total*100).toFixed(1) : 0;
    return ctx.label + ': ' + v.toLocaleString('pt-BR') + ' (' + pct + '%)';
}

// === Função antiga mantida só para compatibilidade caso algo chame
function mktRenderChartTime(ts) {
    var ctx = document.getElementById('mktChartTime');
    if (!ctx || !window.Chart) return;
    var labels = ts.map(function(d) {
        var s = String(d.date || '');
        // Aceita 'YYYY-MM-DD' ou 'YYYYMMDD'
        if (s.indexOf('-') !== -1) {
            var p = s.split('-');
            return p[2] + '/' + p[1];
        }
        if (s.length === 8) {
            return s.slice(6,8) + '/' + s.slice(4,6);
        }
        return s;
    });
    mktState.charts.time = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Sessões',
                    data: ts.map(function(d) { return d.sessions || 0; }),
                    borderColor: '#7B1A2C',
                    backgroundColor: 'rgba(123,26,44,0.12)',
                    yAxisID: 'y',
                    tension: 0.3,
                    fill: true,
                    pointRadius: 2
                },
                {
                    label: 'Investimento (R$)',
                    data: ts.map(function(d) { return d.adSpend || 0; }),
                    borderColor: '#EA580C',
                    backgroundColor: 'rgba(234,88,12,0.12)',
                    yAxisID: 'y1',
                    tension: 0.3,
                    fill: false,
                    pointRadius: 2,
                    borderDash: [5, 4]
                }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { position: 'top' } },
            scales: {
                y:  { type: 'linear', position: 'left',  title: { display: true, text: 'Sessões' } },
                y1: { type: 'linear', position: 'right', title: { display: true, text: 'R$' }, grid: { drawOnChartArea: false } }
            }
        }
    });
}

// === PÁGINA ALMOXARIFADO (acuracidade via webhook n8n) =====
// ============================================================
var ALM_WEBHOOK = N8N_BASE + '/webhook/almoxarifado';
var ALM_META_MENSAL = 160; // meta de itens contados por mês (30 dias)

var almState = {
    startDate: null,
    endDate: null,
    activePreset: '30d',
    estoque: '',
    metaPA: 49,     // meta mensal de contagem — Produto Acabado
    metaMP: 150,    // meta mensal de contagem — Matéria Prima
    data: null,
    charts: {}
};

// Meta mensal aplicável ao filtro atual: PA → metaPA, Matéria Prima → metaMP, sem filtro → soma
function almMetaMensal() {
    var e = (almState.estoque || '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toUpperCase();
    if (!e) return almState.metaPA + almState.metaMP;
    if (e === 'PA' || e.indexOf('ACABADO') !== -1) return almState.metaPA;
    if (e.indexOf('MATERIA') !== -1 || e === 'MP') return almState.metaMP;
    return almState.metaPA + almState.metaMP; // ponytail: estoque desconhecido usa a meta total
}

window.almSetMeta = function(qual, val) {
    var n = parseInt(val) || 0;
    if (qual === 'pa') almState.metaPA = n; else almState.metaMP = n;
    if (almState.data) almRenderBody(almState.data);
};

function almFormatDate(d) {
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + dd;
}
function almNumberBR(n) {
    if (n === null || n === undefined || isNaN(n)) return '0';
    return Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
}
function almMoneyBR(n) {
    if (n === null || n === undefined || isNaN(n)) return 'R$ 0,00';
    return 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function almPctBR(n, decimals) {
    if (n === null || n === undefined || isNaN(n)) return '0%';
    return Number(n).toLocaleString('pt-BR', { minimumFractionDigits: decimals||0, maximumFractionDigits: decimals||2 }) + '%';
}

// Calcula variação % entre atual e anterior. Retorna {pct, direction}.
// invertedScale=true significa "menor é melhor" (ex: disparidades) — inverte cor.
function almVariation(current, previous, invertedScale) {
    var pct = 0, direction = 'neutral';
    if (previous === 0 || previous === null || previous === undefined) {
        if (current > 0) { pct = 100; direction = invertedScale ? 'down' : 'up'; }
        else { pct = 0; direction = 'neutral'; }
    } else {
        pct = ((current - previous) / Math.abs(previous)) * 100;
        if (pct > 0.05)      direction = invertedScale ? 'down' : 'up';
        else if (pct < -0.05) direction = invertedScale ? 'up'   : 'down';
        else direction = 'neutral';
    }
    return { pct: pct, direction: direction };
}

function almVarBadge(current, previous, invertedScale) {
    var v = almVariation(current, previous, invertedScale);
    var arrow = v.direction === 'up' ? '▲' : v.direction === 'down' ? '▼' : '●';
    var sign  = v.pct > 0 ? '+' : '';
    return '<span class="alm-var ' + v.direction + '">' + arrow + ' ' + sign + v.pct.toFixed(1) + '%</span>';
}

function almApplyPreset(preset) {
    var today = new Date(); today.setHours(0,0,0,0);
    var start = new Date(today), end = new Date(today);
    if (preset === '7d')        start.setDate(today.getDate() - 6);
    else if (preset === '30d')  start.setDate(today.getDate() - 29);
    else if (preset === '90d')  start.setDate(today.getDate() - 89);
    else if (preset === 'mes_atual')   {
        start = new Date(today.getFullYear(), today.getMonth(), 1);
        end   = new Date(today.getFullYear(), today.getMonth() + 1, 0); // último dia do mês
    }
    else if (preset === 'mes_anterior'){
        start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        end   = new Date(today.getFullYear(), today.getMonth(), 0);
    }
    almState.startDate = almFormatDate(start);
    almState.endDate   = almFormatDate(end);
    almState.activePreset = preset;
}

function almDaysInRange(s, e) {
    var d1 = new Date(s + 'T00:00:00'), d2 = new Date(e + 'T00:00:00');
    return Math.round((d2 - d1) / 86400000) + 1;
}

window.almSelectPreset = function(preset) {
    almApplyPreset(preset);
    var sEl = document.getElementById('almStart'), eEl = document.getElementById('almEnd');
    if (sEl) sEl.value = almState.startDate;
    if (eEl) eEl.value = almState.endDate;
    // Atualiza destaque do preset ativo sem re-renderizar o header
    document.querySelectorAll('.alm-preset').forEach(function(b) {
        b.classList.toggle('active', b.getAttribute('data-preset') === preset);
    });
    almLoadAndRender();
};

window.almSelectEstoque = function(val) {
    almState.estoque = val || '';
    almLoadAndRender();
};

window.almApplyCustom = function() {
    var s = document.getElementById('almStart').value;
    var e = document.getElementById('almEnd').value;
    if (!s || !e) { alert('Selecione data início e fim.'); return; }
    if (s > e) { alert('A data inicial não pode ser maior que a final.'); return; }
    almState.startDate = s; almState.endDate = e; almState.activePreset = 'custom';
    document.querySelectorAll('.alm-preset').forEach(function(b) { b.classList.remove('active'); });
    almLoadAndRender();
};

async function renderAlmoxarifado() {
    if (!almState.startDate) almApplyPreset('30d');
    var el = document.getElementById('almContent');
    if (!el) return;

    el.innerHTML = ''
        + '<div class="alm-header">'
        +     '<div>'
        +         '<h1>Almoxarifado</h1>'
        +         '<p>Acuracidade de contagem e disparidades por período</p>'
        +     '</div>'
        +     '<div class="alm-filters">'
        +         almPresetBtn('7d',  '7 dias')
        +         almPresetBtn('30d', '30 dias')
        +         almPresetBtn('90d', '90 dias')
        +         almPresetBtn('mes_atual',     'Mês atual')
        +         almPresetBtn('mes_anterior',  'Mês anterior')
        +         '<input type="date" id="almStart" value="' + almState.startDate + '">'
        +         '<input type="date" id="almEnd" value="'   + almState.endDate   + '">'
        +         '<button class="alm-apply" onclick="almApplyCustom()">Aplicar</button>'
        +         '<select id="almEstoque" onchange="almSelectEstoque(this.value)" style="padding:8px 12px;border-radius:8px;border:1px solid var(--card-border);background:var(--card);color:var(--text);font-size:13px">'
        +             '<option value="">Todos os estoques</option>'
        +         '</select>'
        +         '<label style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin:0">Meta PA</label>'
        +         '<input type="number" min="0" value="' + almState.metaPA + '" onchange="almSetMeta(\'pa\', this.value)" style="width:70px;padding:8px 10px;border-radius:8px;border:1px solid var(--card-border);background:var(--card);color:var(--text);font-size:13px">'
        +         '<label style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin:0">Meta MP</label>'
        +         '<input type="number" min="0" value="' + almState.metaMP + '" onchange="almSetMeta(\'mp\', this.value)" style="width:70px;padding:8px 10px;border-radius:8px;border:1px solid var(--card-border);background:var(--card);color:var(--text);font-size:13px">'
        +     '</div>'
        + '</div>'
        + '<div id="almBody"><div class="alm-loading">Carregando dados...</div></div>';

    almLoadAndRender();
}

function almPresetBtn(preset, label) {
    var active = almState.activePreset === preset ? ' active' : '';
    return '<button class="alm-preset' + active + '" data-preset="' + preset + '" onclick="almSelectPreset(\'' + preset + '\')">' + label + '</button>';
}

async function almLoadAndRender() {
    var body = document.getElementById('almBody');
    if (!body) return;
    body.innerHTML = '<div class="alm-loading">Carregando dados de ' + almState.startDate + ' a ' + almState.endDate + '...</div>';

    try {
        var url = ALM_WEBHOOK + '?startDate=' + almState.startDate + '&endDate=' + almState.endDate;
        if (almState.estoque) url += '&estoque=' + encodeURIComponent(almState.estoque);
        var resp = await fetch(url, { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var text = await resp.text();
        var data = text ? JSON.parse(text) : null;
        if (!data || !data.current) {
            body.innerHTML = '<div class="alm-error"><strong>Webhook respondeu vazio ou sem o campo <code>current</code>.</strong><br>'
                + 'Configure o fluxo no n8n para retornar o JSON no schema esperado (current, previous, period, disparidades).</div>';
            return;
        }
        almState.data = data;
        // Popula dropdown de estoques (mantém seleção atual)
        var sel = document.getElementById('almEstoque');
        if (sel && Array.isArray(data.estoques)) {
            var opts = '<option value="">Todos os estoques</option>';
            data.estoques.forEach(function(e) {
                opts += '<option value="' + e + '"' + (almState.estoque === e ? ' selected' : '') + '>' + e + '</option>';
            });
            sel.innerHTML = opts;
        }
        almRenderBody(data);
    } catch (err) {
        body.innerHTML = '<div class="alm-error">Erro ao buscar dados: ' + (err.message || err) + '</div>';
    }
}

function almRenderBody(data) {
    var body = document.getElementById('almBody');
    if (!body) return;
    var cur = data.current || {};
    var prev = data.previous || {};
    var itens = cur.itens || {};
    var pecas = cur.pecas || {};
    var valor = cur.valor || {};
    var pItens = prev.itens || {};
    var pPecas = prev.pecas || {};
    var pValor = prev.valor || {};

    // Meta proporcional ao período
    var days = data.period && data.period.days
        ? data.period.days
        : almDaysInRange(almState.startDate, almState.endDate);
    var meta = (almMetaMensal() * days) / 30;
    var atingidoPct = meta > 0 ? (itens.contados / meta) * 100 : 0;
    var barClass = atingidoPct >= 100 ? 'ok' : (atingidoPct >= 70 ? 'warn' : 'under');

    var html = ''
        // ============ SEÇÃO ITENS (linhas) ============
        + '<div class="alm-section-title itens"><span class="alm-section-dot"></span>Itens (SKUs)</div>'
        + '<div class="alm-kpi-grid">'
        +     almKpi({ label: 'Itens contados', value: almNumberBR(itens.contados), variant: 'blue',
                       cur: itens.contados, prev: pItens.contados,
                       sub: 'Meta: ' + almNumberBR(Math.round(meta)) + ' • ' + almPctBR(atingidoPct, 1),
                       extra: '<div class="alm-progress"><div class="alm-progress-bar ' + barClass + '" style="width:' + Math.min(100, atingidoPct) + '%"></div></div>' })
        +     almKpi({ label: 'Sem divergências', value: almNumberBR(itens.semDivergencia), variant: 'green',
                       cur: itens.semDivergencia, prev: pItens.semDivergencia })
        +     almKpi({ label: 'Divergências positivas', value: almNumberBR(itens.divPositiva), variant: 'teal',
                       cur: itens.divPositiva, prev: pItens.divPositiva, inverted: true,
                       click: 'positiva' })
        +     almKpi({ label: 'Divergências negativas', value: almNumberBR(itens.divNegativa), variant: 'red',
                       cur: itens.divNegativa, prev: pItens.divNegativa, inverted: true,
                       click: 'negativa' })
        +     almKpi({ label: 'Ajuste absoluto', value: almNumberBR(itens.ajusteAbsoluto), variant: 'orange',
                       cur: itens.ajusteAbsoluto, prev: pItens.ajusteAbsoluto, inverted: true })
        +     almKpi({ label: 'Acuracidade', value: almPctBR(itens.acuracidadePct, 2),
                       variant: itens.acuracidadePct >= 95 ? 'green' : (itens.acuracidadePct >= 80 ? 'orange' : 'red'),
                       cur: itens.acuracidadePct, prev: pItens.acuracidadePct })
        + '</div>'
        + '<div class="alm-chart-card"><h4>Evolução — Itens (SKUs)</h4><div class="alm-chart-wrap"><canvas id="almChartItens"></canvas></div></div>'

        // ============ SEÇÃO PEÇAS ============
        + '<div class="alm-section-title pecas"><span class="alm-section-dot"></span>Peças (quantidade)</div>'
        + '<div class="alm-kpi-grid">'
        +     almKpi({ label: 'Peças no sistema', value: almNumberBR(pecas.sistema), variant: 'blue',
                       cur: pecas.sistema, prev: pPecas.sistema })
        +     almKpi({ label: 'Peças contadas', value: almNumberBR(pecas.contadas), variant: 'green',
                       cur: pecas.contadas, prev: pPecas.contadas })
        +     almKpi({ label: 'Divergências positivas', value: almNumberBR(pecas.divPositiva), variant: 'teal',
                       cur: pecas.divPositiva, prev: pPecas.divPositiva, inverted: true,
                       click: 'positiva' })
        +     almKpi({ label: 'Divergências negativas', value: almNumberBR(pecas.divNegativa), variant: 'red',
                       cur: pecas.divNegativa, prev: pPecas.divNegativa, inverted: true,
                       click: 'negativa' })
        +     almKpi({ label: 'Ajuste absoluto', value: almNumberBR(pecas.ajusteAbsoluto), variant: 'orange',
                       cur: pecas.ajusteAbsoluto, prev: pPecas.ajusteAbsoluto, inverted: true })
        +     almKpi({ label: 'Acuracidade', value: almPctBR(pecas.acuracidadePct, 2),
                       variant: (pecas.acuracidadePct >= 99 && pecas.acuracidadePct <= 101) ? 'green' : ((pecas.acuracidadePct >= 95 && pecas.acuracidadePct <= 105) ? 'orange' : 'red'),
                       cur: pecas.acuracidadePct, prev: pPecas.acuracidadePct })
        + '</div>'
        + '<div class="alm-chart-card"><h4>Evolução — Peças</h4><div class="alm-chart-wrap"><canvas id="almChartPecas"></canvas></div></div>'

        // ============ SEÇÃO VALOR ============
        + '<div class="alm-section-title valor"><span class="alm-section-dot"></span>Valor (R$)</div>'
        + '<div class="alm-kpi-grid">'
        +     almKpi({ label: 'Valor do sistema', value: almMoneyBR(valor.sistema), variant: 'blue',
                       cur: valor.sistema, prev: pValor.sistema })
        +     almKpi({ label: 'Valor contado', value: almMoneyBR(valor.contado), variant: 'green',
                       cur: valor.contado, prev: pValor.contado })
        +     almKpi({ label: 'Ajustes positivos', value: almMoneyBR(valor.ajustePositivo), variant: 'teal',
                       cur: valor.ajustePositivo, prev: pValor.ajustePositivo, inverted: true,
                       click: 'positiva' })
        +     almKpi({ label: 'Ajustes negativos', value: almMoneyBR(valor.ajusteNegativo), variant: 'red',
                       cur: valor.ajusteNegativo, prev: pValor.ajusteNegativo, inverted: true,
                       click: 'negativa' })
        +     almKpi({ label: 'Ajuste absoluto', value: almMoneyBR(valor.ajusteAbsoluto), variant: 'orange',
                       cur: valor.ajusteAbsoluto, prev: pValor.ajusteAbsoluto, inverted: true })
        +     almKpi({ label: 'Acuracidade', value: almPctBR(valor.acuracidadePct, 2),
                       variant: (valor.acuracidadePct >= 99 && valor.acuracidadePct <= 101) ? 'green' : ((valor.acuracidadePct >= 95 && valor.acuracidadePct <= 105) ? 'orange' : 'red'),
                       cur: valor.acuracidadePct, prev: pValor.acuracidadePct })
        + '</div>'
        + '<div class="alm-chart-card"><h4>Evolução — Valor (R$)</h4><div class="alm-chart-wrap"><canvas id="almChartValor"></canvas></div></div>';

    body.innerHTML = html;

    // Renderiza os 3 gráficos depois que o DOM existir
    var ts = data.timeSeries || [];
    setTimeout(function() {
        almRenderChartItens(ts);
        almRenderChartPecas(ts);
        almRenderChartValor(ts);
    }, 0);
}

// ============================================================
// === Gráficos de linha por seção ===========================
// ============================================================
function almDateLabel(d) {
    var s = String(d || '');
    if (s.indexOf('-') !== -1) { var p = s.split('-'); return p[2] + '/' + p[1]; }
    if (s.length === 8) return s.slice(6,8) + '/' + s.slice(4,6);
    return s;
}

function almDestroyChart(key) {
    if (almState.charts[key]) {
        try { almState.charts[key].destroy(); } catch(e) {}
        delete almState.charts[key];
    }
}

function almRenderChartItens(ts) {
    var ctx = document.getElementById('almChartItens');
    if (!ctx || !window.Chart) return;
    almDestroyChart('itens');
    if (!ts.length) { ctx.parentElement.innerHTML = '<div class="alm-empty">Sem dados no período.</div>'; return; }
    var labels = ts.map(function(d){ return almDateLabel(d.date); });
    almState.charts.itens = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                { label: 'Itens contados',         data: ts.map(function(d){ return d.itensContados || 0; }),     borderColor: '#2563EB', backgroundColor: 'rgba(37,99,235,0.10)',  yAxisID: 'y',  tension: 0.3, fill: false, pointRadius: 2 },
                { label: 'Divergências positivas', data: ts.map(function(d){ return d.itensDivPositiva || 0; }),  borderColor: '#14B8A6', backgroundColor: 'rgba(20,184,166,0.10)', yAxisID: 'y',  tension: 0.3, fill: false, pointRadius: 2 },
                { label: 'Divergências negativas', data: ts.map(function(d){ return d.itensDivNegativa || 0; }),  borderColor: '#DC2626', backgroundColor: 'rgba(220,38,38,0.10)',  yAxisID: 'y',  tension: 0.3, fill: false, pointRadius: 2 },

// Helper unificado de KPI: aceita objeto de config
function almKpi(cfg) {
    var html = '<div class="alm-kpi ' + (cfg.variant || '') + '">';
    html += '<div class="alm-kpi-label">' + cfg.label + '</div>';
    html += '<div class="alm-kpi-row">';
    if (cfg.click) {
        html += '<div class="alm-kpi-value clickable" onclick="openAlmDispModal(\'' + cfg.click + '\')" title="Clique para ver os itens">' + cfg.value + '</div>';
    } else {
        html += '<div class="alm-kpi-value">' + cfg.value + '</div>';
    }
    if (cfg.cur !== undefined && cfg.prev !== undefined) {
        html += almVarBadge(cfg.cur, cfg.prev, cfg.inverted || false);
    }
    html += '</div>';
    if (cfg.sub)   html += '<div class="alm-kpi-sub">' + cfg.sub + '</div>';
    if (cfg.extra) html += cfg.extra;
    html += '</div>';
    return html;
}

// === Modal: listagem de itens com disparidade ==============
// ============================================================
window.openAlmDispModal = function(variant) {
    if (!almState.data || !almState.data.current) { alert('Dados não carregados ainda.'); return; }
    var disp = (almState.data.current.disparidades) || {};
    var items = variant === 'positiva' ? (disp.positivas || []) : (disp.negativas || []);
    var title = variant === 'positiva' ? 'Itens com Disparidade Positiva (sobra)' : 'Itens com Disparidade Negativa (falta)';

    document.getElementById('almModalTitle').textContent = title + ' — ' + items.length + ' item' + (items.length !== 1 ? 's' : '');
    var bodyEl = document.getElementById('almModalBody');

    if (items.length === 0) {
        bodyEl.innerHTML = '<div class="alm-empty">Nenhum item com disparidade ' + variant + ' no período.</div>';
    } else {
        var html = '<table class="alm-table">'
            + '<thead><tr>'
            +   '<th>Código</th><th>Descrição</th>'
            +   '<th class="num">Esperado</th><th class="num">Contado</th>'
            +   '<th class="num">Diferença</th>'
            +   '<th class="num">Valor unit.</th><th class="num">Valor total</th>'
            +   '<th>Data</th>'
            + '</tr></thead><tbody>';
        items.forEach(function(it) {
            var diffClass = (it.diferenca || 0) >= 0 ? 'alm-pos' : 'alm-neg';
            var totClass  = (it.valorTotal || 0) >= 0 ? 'alm-pos' : 'alm-neg';
            html += '<tr>'
                + '<td><strong>' + (it.codigo || '-') + '</strong></td>'
                + '<td>' + (it.descricao || '-') + '</td>'
                + '<td class="num">' + almNumberBR(it.esperado) + '</td>'
                + '<td class="num">' + almNumberBR(it.contado) + '</td>'
                + '<td class="num ' + diffClass + '">' + (it.diferenca > 0 ? '+' : '') + almNumberBR(it.diferenca) + '</td>'
                + '<td class="num">' + almMoneyBR(it.valorUnitario) + '</td>'
                + '<td class="num ' + totClass + '">' + almMoneyBR(it.valorTotal) + '</td>'
                + '<td>' + (it.data || '-') + '</td>'
                + '</tr>';
        });
        html += '</tbody></table>';
        bodyEl.innerHTML = html;
    }
    document.getElementById('almModal').classList.add('show');
};

window.closeAlmModal = function() {
    document.getElementById('almModal').classList.remove('show');
};

// ============================================================
// === PAINEL ADMIN ==========================================
// ============================================================
async function renderAdminPanel() {
    var el = document.getElementById('adminContent');
    if (!el) return;
    if (!currentProfile || currentProfile.role !== 'admin') {
        el.innerHTML = '<div class="admin-section"><div class="admin-msg error">Acesso negado.</div></div>';
        return;
    }
    el.innerHTML = '<div class="admin-section"><h3>Carregando...</h3></div>';

    // Busca todos os profiles
    var { data: users, error: usersErr } = await supabase
        .from('profiles')
        .select('id, email, full_name, role, active, created_at')
        .order('created_at', { ascending: false });
    if (usersErr) {
        el.innerHTML = '<div class="admin-section"><div class="admin-msg error">Erro ao carregar usuários: ' + usersErr.message + '</div></div>';
        return;
    }

    // Busca todas as páginas pra usar no formulário de permissões
    var { data: allPages } = await supabase
        .from('pages')
        .select('id, name, type, order_idx')
        .order('order_idx', { ascending: true });

    var html = '';
    // Título
    html += '<div style="margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap">';
    html += '<div>';
    html += '<h1 style="font-size:42px;font-weight:700;color:var(--text);margin-bottom:6px">Administra&ccedil;&atilde;o</h1>';
    html += '<p style="font-size:21px;color:var(--text-muted)">Gerenciamento de usu&aacute;rios e permiss&otilde;es</p>';
    html += '</div>';
    html += '<img src="Logo_Docs.png" alt="Enterplak" style="height:60px;width:auto;opacity:0.7">';
    html += '</div>';

    // Form para criar novo usuário
    html += '<div class="admin-section">';
    html += '<h3>Criar Novo Usu&aacute;rio</h3>';
    html += '<div class="admin-msg hidden" id="newUserMsg"></div>';
    html += '<div class="admin-form">';
    html += '<div><label>Email</label><input type="email" id="newUserEmail" placeholder="usuario@enterplak.com"></div>';
    html += '<div><label>Senha tempor&aacute;ria</label><input type="text" id="newUserPass" placeholder="m&iacute;nimo 6 caracteres"></div>';
    html += '<div><label>Nome Completo</label><input type="text" id="newUserName" placeholder="Nome do usu&aacute;rio"></div>';
    html += '<div><label>Papel</label><select id="newUserRole" onchange="toggleNewUserPermsVisibility()">' +
        '<option value="usuario">Usu&aacute;rio (permiss&otilde;es individuais)</option>' +
        '<option value="moderador">Moderador (v&ecirc; tudo + cria/edita p&aacute;ginas)</option>' +
        '<option value="admin">Administrador (acesso total)</option>' +
        '</select></div>';
    // Permissões (visível só para usuario)
    html += '<div class="full" id="newUserPermsBox"><label>P&aacute;ginas que este usu&aacute;rio pode ver</label><div class="admin-perms" id="newUserPerms">';
    (allPages || []).forEach(function(pg) {
        html += '<label class="admin-perm" data-pid="' + pg.id + '"><input type="checkbox" value="' + pg.id + '"> ' + pg.name + '</label>';
    });
    html += '</div></div>';
    html += '<div class="full"><button class="admin-btn" onclick="createNewUser()">Criar Usu&aacute;rio</button></div>';
    html += '</div></div>';

    // Lista de usuários
    html += '<div class="admin-section">';
    html += '<h3>Usu&aacute;rios cadastrados (' + (users || []).length + ')</h3>';
    html += '<table class="admin-table">';
    html += '<thead><tr><th>Email</th><th>Nome</th><th>Papel</th><th>Status</th><th>A&ccedil;&otilde;es</th></tr></thead>';
    html += '<tbody>';
    (users || []).forEach(function(u) {
        var isMe = u.id === currentUser.id;
        html += '<tr>';
        html += '<td>' + u.email + (isMe ? ' <small style="color:var(--text-muted)">(voc&ecirc;)</small>' : '') + '</td>';
        html += '<td>' + (u.full_name || '-') + '</td>';
        html += '<td><span class="admin-role-pill ' + u.role + '">' + u.role + '</span></td>';
        html += '<td>' + (u.active === false ? '<span style="color:var(--red)">Desativado</span>' : '<span style="color:var(--green)">Ativo</span>') + '</td>';
        html += '<td style="display:flex;gap:6px;flex-wrap:wrap">';
        if (!isMe) {
            html += '<button class="admin-btn" style="padding:6px 14px;font-size:11px" onclick="openEditUserModal(\'' + u.id + '\')">Editar</button>';
            html += '<button class="admin-btn secondary" style="padding:6px 12px;font-size:11px" onclick="toggleUserActive(\'' + u.id + '\',' + (u.active !== false) + ')">' + (u.active === false ? 'Reativar' : 'Desativar') + '</button>';
        }
        html += '</td>';
        html += '</tr>';
    });
    html += '</tbody></table>';
    html += '</div>';

    el.innerHTML = html;
    toggleNewUserPermsVisibility();

    // Marca/desmarca os checkboxes visualmente
    el.querySelectorAll('.admin-perm input[type=checkbox]').forEach(function(cb) {
        cb.addEventListener('change', function() {
            cb.closest('.admin-perm').classList.toggle('checked', cb.checked);
        });
    });
}

window.toggleNewUserPermsVisibility = function() {
    var role = document.getElementById('newUserRole').value;
    document.getElementById('newUserPermsBox').style.display = (role === 'usuario') ? '' : 'none';
};

window.createNewUser = async function() {
    var msgEl = document.getElementById('newUserMsg');
    var showMsg = function(txt, type) {
        msgEl.textContent = txt;
        msgEl.className = 'admin-msg ' + type;
    };
    var email = document.getElementById('newUserEmail').value.trim();
    var pass = document.getElementById('newUserPass').value;
    var name = document.getElementById('newUserName').value.trim();
    var role = document.getElementById('newUserRole').value;
    if (!email || !pass || pass.length < 6) {
        showMsg('Email e senha (mín. 6 caracteres) obrigatórios.', 'error');
        return;
    }
    var perms = [];
    if (role === 'usuario') {
        document.querySelectorAll('#newUserPerms input[type=checkbox]:checked').forEach(function(cb) {
            perms.push(cb.value);
        });
        if (perms.length === 0) {
            if (!confirm('Este usuário não terá acesso a nenhuma página. Tem certeza?')) return;
        }
    }

    showMsg('Criando usuário...', 'success');

    // Cria com cliente temporário (não afeta sessão do admin)
    var tempClient = window.supabaseLib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false, autoRefreshToken: false }
    });

    try {
        var { data, error } = await tempClient.auth.signUp({
            email: email,
            password: pass,
            options: {
                data: {
                    full_name: name || email,
                    role: role
                }
            }
        });
        if (error) throw error;
        var newUserId = data.user && data.user.id;
        if (!newUserId) throw new Error('Usuário criado mas ID não retornado.');

        // O trigger já cria o profile com o role. Mas força o role e full_name por garantia.
        await supabase.from('profiles').update({ role: role, full_name: name || email }).eq('id', newUserId);

        // Se for 'usuario', salva as permissões
        if (role === 'usuario' && perms.length > 0) {
            var rows = perms.map(function(pid) { return { user_id: newUserId, page_id: pid }; });
            await supabase.from('user_page_permissions').insert(rows);
        }

        showMsg('Usuário ' + email + ' criado com sucesso!', 'success');
        document.getElementById('newUserEmail').value = '';
        document.getElementById('newUserPass').value = '';
        document.getElementById('newUserName').value = '';
        document.querySelectorAll('#newUserPerms input').forEach(function(cb) { cb.checked = false; cb.closest('.admin-perm').classList.remove('checked'); });
        // Re-renderiza painel
        setTimeout(renderAdminPanel, 1200);
    } catch (err) {
        showMsg('Erro: ' + (err.message || err), 'error');
    }
};

// === Modal de edição de usuário ===
var _editingUserId = null;

window.openEditUserModal = async function(userId) {
    _editingUserId = userId;
    var modal = document.getElementById('editUserModal');
    var msgEl = document.getElementById('editUserMsg');
    msgEl.className = 'admin-msg hidden';
    modal.classList.add('show');
    document.getElementById('editUserEmail').textContent = 'Carregando...';
    document.getElementById('editUserPerms').innerHTML = '';

    // Carrega profile, todas as páginas, e permissões atuais em paralelo
    var [profRes, pagesRes, permsRes] = await Promise.all([
        supabase.from('profiles').select('email, full_name, role').eq('id', userId).single(),
        supabase.from('pages').select('id, name, type, order_idx').order('order_idx', { ascending: true }),
        supabase.from('user_page_permissions').select('page_id').eq('user_id', userId)
    ]);

    if (profRes.error) {
        document.getElementById('editUserEmail').textContent = 'Erro ao carregar: ' + profRes.error.message;
        return;
    }
    var prof = profRes.data;
    var allPages = pagesRes.data || [];
    var existingPerms = new Set((permsRes.data || []).map(function(p) { return p.page_id; }));

    document.getElementById('editUserEmail').textContent = prof.email + (prof.full_name ? ' — ' + prof.full_name : '');

    // Seleciona o role atual nos cards
    document.querySelectorAll('#editRoleOptions .role-opt').forEach(function(opt) {
        var isCurrent = opt.getAttribute('data-role') === prof.role;
        opt.classList.toggle('selected', isCurrent);
        opt.querySelector('input').checked = isCurrent;
    });

    // Monta grid de permissões com checkboxes (pré-marcando as existentes)
    var permsHtml = '';
    allPages.forEach(function(pg) {
        var checked = existingPerms.has(pg.id);
        permsHtml += '<label class="admin-perm' + (checked ? ' checked' : '') + '" data-pid="' + pg.id + '">'
                  + '<input type="checkbox" value="' + pg.id + '"' + (checked ? ' checked' : '') + '> '
                  + pg.name + '</label>';
    });
    document.getElementById('editUserPerms').innerHTML = permsHtml;
    // Bind dos checkboxes para atualizar visual
    document.querySelectorAll('#editUserPerms input[type=checkbox]').forEach(function(cb) {
        cb.addEventListener('change', function() {
            cb.closest('.admin-perm').classList.toggle('checked', cb.checked);
        });
    });

    // Bind dos cards de role para selecionar visualmente + habilitar/desabilitar perms
    document.querySelectorAll('#editRoleOptions .role-opt').forEach(function(opt) {
        opt.onclick = function() {
            document.querySelectorAll('#editRoleOptions .role-opt').forEach(function(o) { o.classList.remove('selected'); });
            opt.classList.add('selected');
            opt.querySelector('input').checked = true;
            updateEditPermsVisibility();
        };
    });
    updateEditPermsVisibility();
};

function updateEditPermsVisibility() {
    var selected = document.querySelector('#editRoleOptions .role-opt.selected');
    var role = selected ? selected.getAttribute('data-role') : 'usuario';
    var section = document.getElementById('editPermsSection');
    section.classList.toggle('disabled', role !== 'usuario');
}

window.editUserPermsToggleAll = function(check) {
    document.querySelectorAll('#editUserPerms input[type=checkbox]').forEach(function(cb) {
        cb.checked = check;
        cb.closest('.admin-perm').classList.toggle('checked', check);
    });
};

window.closeEditUserModal = function() {
    document.getElementById('editUserModal').classList.remove('show');
    _editingUserId = null;
};

window.saveEditUserModal = async function() {
    if (!_editingUserId) return;
    var btn = document.getElementById('editUserSaveBtn');
    var msgEl = document.getElementById('editUserMsg');
    var showMsg = function(txt, type) {
        msgEl.textContent = txt;
        msgEl.className = 'admin-msg ' + type;
    };

    var selected = document.querySelector('#editRoleOptions .role-opt.selected');
    if (!selected) { showMsg('Selecione um papel.', 'error'); return; }
    var role = selected.getAttribute('data-role');

    var perms = [];
    document.querySelectorAll('#editUserPerms input[type=checkbox]:checked').forEach(function(cb) {
        perms.push(cb.value);
    });

    btn.disabled = true; btn.textContent = 'Salvando...';
    try {
        // 1. Atualiza role
        var { error: roleErr } = await supabase.from('profiles').update({ role: role }).eq('id', _editingUserId);
        if (roleErr) throw roleErr;

        // 2. Apaga permissões antigas
        var { error: delErr } = await supabase.from('user_page_permissions').delete().eq('user_id', _editingUserId);
        if (delErr) throw delErr;

        // 3. Se 'usuario' e tem permissões, insere as novas
        if (role === 'usuario' && perms.length > 0) {
            var rows = perms.map(function(pid) { return { user_id: _editingUserId, page_id: pid }; });
            var { error: insErr } = await supabase.from('user_page_permissions').insert(rows);
            if (insErr) throw insErr;
        }

        showMsg('Alterações salvas com sucesso!', 'success');
        setTimeout(function() {
            closeEditUserModal();
            renderAdminPanel();
        }, 700);
    } catch (err) {
        showMsg('Erro: ' + (err.message || err), 'error');
    } finally {
        btn.disabled = false; btn.textContent = 'Salvar alterações';
    }
};

window.toggleUserActive = async function(userId, currentlyActive) {
    var novo = !currentlyActive;
    if (!confirm(novo ? 'Reativar este usuário?' : 'Desativar este usuário? Ele não conseguirá mais entrar.')) return;
    var { error } = await supabase.from('profiles').update({ active: novo }).eq('id', userId);
    if (error) { alert('Erro: ' + error.message); return; }
    renderAdminPanel();
};
